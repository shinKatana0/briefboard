// a number nobody can produce is worse than silence.

// Rounded to whole seconds and read in the current language: h/m/s abbreviate
// differently in each, so the unit is part of the string, not appended to it.
function formatDuration(ms) {
  const total = Math.max(0, Math.round(Number(ms) / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return tFill('cost_dur_h', { h: h, m: m });
  if (m) return tFill('cost_dur_m', { m: m, s: s });
  return tFill('cost_dur_s', { s: s });
}

// Non-breaking spaces: a six-figure token count broken across two lines is
// unreadable, and the group separator differs by locale anyway.
function groupDigits(n) {
  return String(Math.round(Number(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
}

// A run's own duration, live: a running session's total grows while the page
// stands still, so it is measured from its start rather than taken from the
// summary, which is only as fresh as the last /api/sessions answer.
function runDuration(run, now) {
  if (!run.running) return Number(run.durationMs) || 0;
  const started = Date.parse(run.startedAt);
  return Number.isFinite(started) ? Math.max(0, now - started) : Number(run.durationMs) || 0;
}

// The board's own kinds; anything else is shown as it is written rather than
// dropped.
const SESSION_KINDS = ['briefing', 'worker', 'orchestrator'];
function costKindLabel(kind) {
  return SESSION_KINDS.includes(kind) ? t('cost_kind_' + kind) : String(kind || '');
}

function costRunHtml(run, now) {
  const outcome = t('session_' + run.outcome);
  const exit =
    run.outcome === 'failed' && run.exitCode !== null && run.exitCode !== undefined
      ? ` <span>${esc(tFill('cost_exit', { code: run.exitCode }))}</span>`
      : '';
  return (
    '<li>' +
    `<span class="cost-kind">${esc(costKindLabel(run.kind))}</span>` +
    `<span class="cost-time">${esc(formatDuration(runDuration(run, now)))}</span>` +
    `<span>${esc(outcome)}</span>${exit}` +
    '</li>'
  );
}

function costBlockHtml(id) {
  const cost = costsById.get(id);
  if (!cost || !cost.sessions) return '';
  const now = Date.now();
  const runs = cost.entries || [];
  const total = runs.reduce((sum, run) => sum + runDuration(run, now), 0);
  const soFar = cost.running ? ` <span class="empty">(${esc(t('cost_so_far'))})</span>` : '';
  // Only when a number was actually read out of a log. Null is not zero: it
  // means nobody told us, and the board does not fill that in.
  const tokens =
    typeof cost.tokens === 'number'
      ? `<div class="cost-tokens">${esc(tFill('cost_tokens', { tokens: groupDigits(cost.tokens) }))}` +
        (cost.tokenSessions < cost.sessions
          ? ` <span class="empty">(${esc(
              tFill('cost_tokens_some', { count: cost.tokenSessions, total: cost.sessions })
            )})</span>`
          : '') +
        '</div>'
      : '';
  const partial = cost.complete
    ? ''
    : `<div class="cost-partial">${esc(tFill('cost_partial', { count: cost.dropped }))}</div>`;
  return `
    <div class="cost">
      <h3>${esc(t('cost_title'))}</h3>
      <div class="cost-total">${esc(tFill('cost_sessions', { count: cost.sessions }))} · ${esc(
        tFill('cost_total', { duration: formatDuration(total) })
      )}${soFar}</div>
      <ul class="cost-runs">${runs.map((run) => costRunHtml(run, now)).join('')}</ul>
      ${tokens}
      ${partial}
    </div>`;
}

// ---------- closing the loop (T-0117, T-0148) ----------
// The path used to break off here: the block named the branch and the worktree,
// and everything else was prose pointing at the guide. It now carries what the
// board can check and what it may do — whether git has the branch in HEAD, the
// merge line ready to copy, and the two actions (accept, remove the worktree).
//
// It still does not merge (T-0117): a merge is a judgement, and a button that
// merges will one day merge the wrong thing. The tests are not named either —
// the board runs on Node and the project may be anything, so it says "your own
// tests" rather than inventing a command it cannot keep the promise of.
//
// The state comes from git, asked for when the card is opened or rechecked. Not
// on the board's own repaint: the backlog changes for a dozen reasons a minute
// and git state changes for none of them, so a check per SSE frame would run git
// for every open tab and learn nothing new.
const CLOSING_STATUSES = ['review', 'done'];
let gitStateById = new Map();

// The container only: what goes inside depends on an answer that has not arrived
// yet when the dialog is built.
function closingBlockHtml(task) {
  if (!CLOSING_STATUSES.includes(task.status)) return '';
  return `<div class="closing" data-closing><div class="closing-hint">${esc(t('closing_checking'))}</div></div>`;
}

// Why an action is refused, in the board's words. The server sends the same
// reasons back when it refuses one for real — the check here is UX, that one is
// the rule (the same split as every other write on this board).
const CLOSING_WHY = {
  'not-merged': 'closing_why_not_merged',
  dirty: 'closing_why_dirty',
  'ambiguous-branch': 'closing_why_ambiguous',
  'session-running': 'closing_why_session',
  'no-git': 'closing_why_git',
  'not-a-repo': 'closing_why_git',
};

function closingStateLine(state) {
  if (state.git === 'no-git') return { key: 'closing_state_no_git', tone: 'unknown' };
  if (state.git === 'not-a-repo') return { key: 'closing_state_not_repo', tone: 'unknown' };
  if (state.git !== 'ok') return { key: 'closing_state_failed', tone: 'unknown' };
  if ((state.branches || []).length > 1) {
    return { key: 'closing_state_ambiguous', tone: 'unknown', vars: { count: state.branches.length } };
  }
  if (!state.branch) return { key: 'closing_state_no_branch', tone: 'unknown' };
  const head = state.head || 'HEAD';
  return state.merged
    ? { key: 'closing_state_merged', tone: 'merged', vars: { head } }
    : { key: 'closing_state_unmerged', tone: 'unmerged', vars: { head } };
}

// The one reason that blocks accepting: a branch this task certainly owns, and
// HEAD does not have it. Ambiguity is not one — the board created that doubt,
// and refusing a human's verdict over it would be worse than recording it.
function acceptBlocker(state) {
  if (state.git === 'ok' && state.branch && state.merged === false) return 'not-merged';
  return null;
}

// Deleting is the other way round: every doubt blocks it, because there is no
// undo. The rules are T-0099's, and the server applies them again for real.
function removeBlocker(state, id) {
  if (state.git !== 'ok') return 'no-git';
  const session = sessionsById.get(id);
  if (session && session.status === 'running') return 'session-running';
  if (!state.branch) return (state.branches || []).length > 1 ? 'ambiguous-branch' : 'not-merged';
  if (state.merged !== true) return 'not-merged';
  if (state.worktreeClean !== true) return 'dirty';
  return null;
}

function closingActionHtml(action, label, blocker) {
  const why = blocker ? `<span class="closing-why">${esc(t(CLOSING_WHY[blocker] || 'closing_why_git'))}</span>` : '';
  return `<button type="button" class="tf-btn" data-closing-${action}${blocker ? ' disabled' : ''}>${esc(label)}</button>${why}`;
}

const canCopy = () =>
  typeof navigator !== 'undefined' && !!navigator.clipboard && !!navigator.clipboard.writeText;

// A branch name and a filesystem path are data: they are left out of the markup
// and put in with textContent below, so a path that happens to contain markup is
// shown as written and never parsed — the same rule the session log follows.
function closingContentHtml(task, state) {
  const ok = state.git === 'ok';
  const line = closingStateLine(state);
  // A finished task with nothing left to clean up has nothing to say.
  if (task.status !== 'review' && !(ok && state.worktree)) return '';
  const rows =
    (ok && state.branch ? `<dt>${esc(t('closing_branch'))}</dt><dd data-closing-branch></dd>` : '') +
    (ok && state.worktree ? `<dt>${esc(t('closing_worktree'))}</dt><dd data-closing-worktree></dd>` : '');
  const merge =
    ok && state.branch && state.merged === false
      ? `<div class="closing-hint">${esc(t('closing_step_diff'))}</div>` +
        `<div class="closing-hint">${esc(t('closing_merge_hint'))}</div>` +
        '<div class="closing-cmd"><code data-closing-command></code>' +
        (canCopy()
          ? `<button type="button" class="tf-btn" data-closing-copy>${esc(t('closing_copy'))}</button>`
          : '') +
        '</div>'
      : '';
  const actions =
    (task.status === 'review'
      ? closingActionHtml('accept', t('closing_accept'), acceptBlocker(state))
      : '') +
    (ok && state.worktree
      ? closingActionHtml('remove', t('closing_remove'), removeBlocker(state, task.id))
      : '') +
    `<button type="button" class="tf-btn" data-closing-recheck>${esc(t('closing_recheck'))}</button>`;
  return `
    <h3>${esc(t('closing_title'))}</h3>
    ${rows ? `<dl>${rows}</dl>` : ''}
    <div class="closing-state ${line.tone}">${esc(tFill(line.key, line.vars || {}))}</div>
    ${merge}
    <div class="closing-actions">${actions}</div>
    <div class="closing-note">${esc(t('closing_note'))} ${esc(t('closing_guide'))}</div>`;
}

function paintClosingBlock(overlay, task) {
  const box = overlay.querySelector('[data-closing]');
  if (!box) return;
  const state = gitStateById.get(task.id) || { git: 'pending' };
  box.innerHTML = closingContentHtml(task, state);
  const fill = (selector, text) => {
    const el = box.querySelector(selector);
    if (el) el.textContent = text;
  };
  if (state.branch) {
    fill('[data-closing-branch]', state.branch);
    if (state.merged === false) fill('[data-closing-command]', 'git merge --no-ff ' + state.branch);
  }
  if (state.worktree) fill('[data-closing-worktree]', state.worktree);
  wireClosingBlock(overlay, box, task);
}

function wireClosingBlock(overlay, box, task) {
  const on = (selector, handler) => {
    const el = box.querySelector(selector);
    if (el) el.addEventListener('click', handler);
  };
  on('[data-closing-recheck]', () => loadClosingBlock(overlay, task));
  on('[data-closing-accept]', (e) => {
    if (!e.target.disabled) acceptTask(overlay, task);
  });
  on('[data-closing-remove]', (e) => {
    if (!e.target.disabled) removeTaskWorktree(overlay, task);
  });
  on('[data-closing-copy]', (e) => copyClosingCommand(e.target, box));
}

async function loadClosingBlock(overlay, task) {
  if (!CLOSING_STATUSES.includes(task.status)) return;
  try {
    const r = await fetch('/api/git/' + encodeURIComponent(task.id));
    gitStateById.set(task.id, r.ok ? await r.json() : { git: 'failed' });
  } catch {
    gitStateById.set(task.id, { git: 'failed' });
  }
  paintClosingBlock(overlay, task);
}

function copyClosingCommand(button, box) {
  const command = box.querySelector('[data-closing-command]');
  if (!command || !canCopy()) return;
  navigator.clipboard.writeText(command.textContent).then(() => {
    button.textContent = t('closing_copied');
  }, () => {});
}

// `done` is terminal, so this asks first — the board has no way back from it.
// The card is repainted from the answer rather than from the board's next
// refresh: the worktree is usually removed in the same breath, and the button
// for that has to be there the moment the task is accepted.
async function acceptTask(overlay, task) {
  if (!confirm(tFill('closing_accept_confirm', { id: task.id, title: task.title }))) return;
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(task.id) + '/done', { method: 'POST' });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      alert(
        data && data.reason
          ? tFill('closing_remove_refused', { reason: t(CLOSING_WHY[data.reason] || 'closing_accept_failed') })
          : t(writeErrorKey(r.status, 'closing_accept_failed'))
      );
      await loadClosingBlock(overlay, task);
      return;
    }
    task.status = 'done'; // the dialog's own copy; the board repaints from SSE
    await loadClosingBlock(overlay, task);
  } catch {
    alert(t('closing_accept_failed'));
  }
}

async function removeTaskWorktree(overlay, task) {
  if (!confirm(tFill('closing_remove_confirm', { id: task.id }))) return;
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(task.id) + '/remove-worktree', {
      method: 'POST',
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      alert(
        data && data.reason
          ? tFill('closing_remove_refused', { reason: t(CLOSING_WHY[data.reason] || 'closing_remove_failed') })
          : t(writeErrorKey(r.status, 'closing_remove_failed'))
      );
    }
    await loadClosingBlock(overlay, task);
  } catch {
    alert(t('closing_remove_failed'));
  }
}

function openTask(id) {
  const task = tasks.find((x) => x.id === id);
  if (!task) return;
  const color = STATUS_COLOR[task.status];
  const label = statusLabel(task.status);
  const depends = task.depends || [];
  const hasProfiles = (sessionsConfigured.profiles || []).length > 0;
  const overlay = openModal(`
    <div class="head">
      <span class="id">${task.id}</span>
      <span class="prio ${task.priority}" title="${task.priority}" aria-label="${task.priority}">${PRIO_ICON[task.priority] || task.priority}</span>
      ${typeTagHtml(task)}
      <span class="status-chip" style="background:${color}">${label}</span>
    </div>
    <h2>${esc(task.title)}</h2>
    <dl class="meta">
      <dt>${t('meta_type')}</dt><dd>${task.type}</dd>
      <dt>${t('meta_status')}</dt><dd style="color:${color}">${task.status}</dd>
      <dt>${t('meta_created')}</dt><dd>${task.created || '—'}</dd>
      <dt>${t('meta_closed')}</dt><dd>${task.closed || '—'}</dd>
      <dt>${t('meta_briefs')}</dt><dd>${
        task.briefs.length
          ? task.briefs.map((b) => `<span class="brief-link" data-brief="${b}">${b}</span>`).join('')
          : `<span class="empty">${t('empty_briefs')}</span>`
      }</dd>
      <dt>${t('meta_labels')}</dt><dd data-label-area data-labels="${esc((task.labels || []).join(','))}">${labelEditorHtml(task.labels || [], 'label-options-' + task.id)}</dd>
      <dt>${t('meta_depends')}</dt><dd>${
        depends.length
          ? depends.map(depLinkHtml).join('')
          : `<span class="empty">${t('empty_depends')}</span>`
      }</dd>
      ${hasProfiles ? `<dt>${t('meta_profile')}</dt><dd>${profileSelectHtml(task)}</dd>` : ''}
    </dl>
    ${watchdogNoteHtml(task)}
    <div data-session-area>${sessionAreaHtml(task)}</div>
    ${costBlockHtml(task.id)}
    ${closingBlockHtml(task)}
    <div class="desc">${task.description ? md(task.description) : `<span class="empty">${t('empty_desc')}</span>`}</div>
    ${task.awaitingAnswer ? answerFormHtml(task) : ''}
    <div class="hint">${t('hint_close')}</div>`);
  // The dialog's own copy of the task, kept so the session area can be repainted
  // in place while the dialog stays open (see refreshOpenTaskSessions).
  overlay._task = task;
  loadClosingBlock(overlay, task);
  if (task.awaitingAnswer) wireAnswerForm(overlay, task.id);
  overlay.querySelectorAll('[data-brief]').forEach((el) =>
    el.addEventListener('click', () => openBrief(el.dataset.brief))
  );
  wireLabelEditor(overlay, task);
  wireSessionArea(overlay, task);
  if (hasProfiles) wireProfileSelect(overlay);
  wireDependencyLinks(overlay);
}

// ---------- the sessions started from the card's dialog ----------
// The review session (T-0122) and the briefing one (T-0141). Buttons and not
// drops: the task is ALREADY in the status the session belongs to, so there is no
// column to move it into and no status to change. The only drop that could
// express either would be one onto the column the card already sits in, a gesture
// the board has nowhere else.
//
// Each belongs to exactly one status and appears on no other: someone who never
// runs a review session must not read about one on every card. Inside that
// status the block is always there, because an unconfigured board used to show
// nothing at all — the action was searched for and not found (T-0144). With no
// command it says which variable turns the session on, in the place the button
// would have been.
//
// The block also says what the session does BEFORE it is started, which for the
// review one is the whole point: it never sets a status (T-0122), while a
// briefing or worker session that leaves the status untouched means trouble
// (observed on T-0118). From outside, the two look the same, so the difference
// has to be stated as a property of this session rather than explained after the
// fact (T-0146).
//
// `visible` rather than a status, because the third action here — stopping
// (T-0211) — belongs to a task whose session is running, which is a fact about
// the registry and not about the column the card sits in.
//
// The button appears only where pressing it can work. Every reason it cannot is
// said in its place instead, in the same line the button would have occupied
// (T-0220): the block that explains what the session does is worth keeping
// either way, and a board that offers an action it knows will be refused is the
// exact opposite of the rule these blocks were built on — say beforehand what
// will happen, do not explain it after the click.
function sessionActionHtml(task, { visible, enabled, busy, attr, titleKey, whatKey, buttonKey, unconfiguredKey }) {
  if (!visible) return '';
  // Not configured comes first: it is the durable fact, and a session that is
  // running right now says nothing about a command that was never set.
  const whyNot = !enabled ? unconfiguredKey : busy ? 'session_start_running' : '';
  const action = whyNot
    ? `<div class="card-action-why">${esc(t(whyNot))}</div>`
    : `<div class="card-action-row"><button type="button" class="tf-btn" ${attr}="${esc(task.id)}">` +
      `${esc(t(buttonKey))}</button></div>`;
  return `<div class="card-action"><h3>${esc(t(titleKey))}</h3>` +
    `<div class="card-action-what">${esc(t(whatKey))}</div>${action}</div>`;
}

// One session per task is the registry's shape, not a rule about kinds: it keeps
// one record per task id, and the server refuses a second start with
// `already-running` whatever kind is asked for. So the card asks the same
// question the server will (T-0221).
const sessionBusy = (task) => sessionState(task.id) === 'running';

function briefingActionHtml(task) {
  return sessionActionHtml(task, {
    visible: task.status === 'open',
    enabled: sessionsConfigured.enabled,
    busy: sessionBusy(task),
    attr: 'data-briefing-session',
    titleKey: 'briefing_session_title',
    whatKey: 'briefing_session_what',
    buttonKey: 'briefing_session_button',
    unconfiguredKey: 'briefing_session_unconfigured',
  });
}

function reviewActionHtml(task) {
  return sessionActionHtml(task, {
    visible: task.status === 'review',
    enabled: sessionsConfigured.orchestrator,
    busy: sessionBusy(task),
    attr: 'data-review-session',
    titleKey: 'review_session_title',
    whatKey: 'review_session_what',
    buttonKey: 'review_session_button',
    unconfiguredKey: 'review_session_unconfigured',
  });
}

// ---------- stopping the running session from the card (T-0211) ----------
// The kill endpoint has existed since T-0077, and until now the only way to
// reach it was to open the session log: to stop a session you had to guess that
// the control lived behind its output. That cost more than the earlier
// findability cases (T-0144, T-0145) — while the button is being looked for, the
// session keeps spending the user's tokens.
//
// Shown for a session in any of the three kinds, and it needs no test for which:
// the registry holds one record per TASK, so "a session is running here" is the
// whole condition, whether it is a worker, a briefing or a review one. Which
// kind it is the cost block below already names, run by run.
//
// It is never offered when nothing is running — like every other action on this
// card, it is simply absent rather than present and dead. `enabled` is therefore
// always true: unlike starting a session, stopping one depends on no
// configuration, because the session it stops is proof the board can run it.
//
// The button in the log window stays. Both press the same endpoint and ask the
// same confirmation, so the duplication cannot drift; and the person reading a
// log is exactly the one who decides mid-read to stop, so taking it away there
// would move the same bug one step further in.
function stopActionHtml(task) {
  return sessionActionHtml(task, {
    visible: sessionState(task.id) === 'running',
    enabled: true,
    attr: 'data-stop-session',
    titleKey: 'session_stop_title',
    whatKey: 'session_stop_what',
    buttonKey: 'session_stop_button',
  });
}

// Everything the dialog says about sessions on this task: the log to read the
// running one by, the action to stop it, and the ones that can be started. Kept
// as one fragment because it is repainted as one — a session that starts or ends
// while the card is open changes every part of it (see refreshOpenTaskSessions).
// The start blocks were rendered straight into the dialog body until T-0220,
// which is why they went on offering a start through a session they could see
// running: a fragment that is never repainted cannot notice.
function sessionAreaHtml(task) {
  const log = sessionState(task.id)
    ? `<div class="session-row"><button type="button" class="tf-btn" data-session-log="${esc(task.id)}">` +
      `${esc(t('session_log_button'))}</button></div>`
    : '';
  return log + treeNoteHtml(task) + stopActionHtml(task) + briefingActionHtml(task) + reviewActionHtml(task);
}

function wireSessionArea(overlay, task) {
  overlay.querySelectorAll('[data-session-log]').forEach((el) =>
    el.addEventListener('click', () => openSessionLog(el.dataset.sessionLog))
  );
  const stopButton = overlay.querySelector('[data-stop-session]');
  if (stopButton) stopButton.addEventListener('click', () => requestSessionStop(task.id));
  const briefingButton = overlay.querySelector('[data-briefing-session]');
  if (briefingButton) briefingButton.addEventListener('click', () => startBriefingSession(task));
  const reviewButton = overlay.querySelector('[data-review-session]');
  if (reviewButton) reviewButton.addEventListener('click', () => startReviewSession(task));
}

// An open card catches up with the session registry, the way an open log already
// does. Without this the stop action would appear only on a card opened AFTER
// the session started — and the card is also where a briefing or review session
// is started from, so the commonest way to end up wanting the stop button is to
// press the start button one dialog above it.
function refreshOpenTaskSessions() {
  for (const overlay of modals) {
    if (!overlay._task) continue;
    const area = overlay.querySelector('[data-session-area]');
    if (!area) continue;
    area.innerHTML = sessionAreaHtml(overlay._task);
    wireSessionArea(overlay, overlay._task);
  }
}

// Confirmed like the worker drop, and for the same reason: it starts a process
// that reads the repository and writes into the backlog. Each text says what its
// session will NOT do — the review one sets no status and merges nothing, the
// briefing one replaces no brief that is already there — because that is the part
// a reader might otherwise assume.
//
// One body for both: what they must share is the part that is easy to get subtly
// wrong. Unlike the drops, the session IS the whole action here — no transition
// stands behind the click — so a 200 that started nothing has to be said out loud
// or the click reads as having worked.
async function startCardSession(task, { action, confirmKey, failedKey, refusedKey }) {
  if (!confirm(tFill(confirmKey, { id: task.id, title: task.title }))) return;
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(task.id) + '/' + action, { method: 'POST' });
    if (!r.ok) {
      alert(t(writeErrorKey(r.status, failedKey)));
      return;
    }
    const data = await r.json().catch(() => ({}));
    if (data && data.session && data.session !== 'started') {
      alert(tFill(refusedKey, { reason: data.session }));
    }
    // A started session repaints the board through the SSE "sessions" event.
  } catch {
    alert(t(failedKey));
  }
}

function startBriefingSession(task) {
  return startCardSession(task, {
    action: 'briefing',
    confirmKey: 'briefing_session_confirm',
    failedKey: 'briefing_session_failed',
    refusedKey: 'briefing_session_refused',
  });
}

function startReviewSession(task) {
  return startCardSession(task, {
    action: 'review',
    confirmKey: 'review_session_confirm',
    failedKey: 'review_session_failed',
    refusedKey: 'review_session_refused',
  });
}

function wireProfileSelect(overlay) {
  overlay.querySelectorAll('[data-profile-select]').forEach((el) =>
    el.addEventListener('change', () => setTaskProfile(el.dataset.profileSelect, String(el.value || '')))
  );
}

// ---------- labels (T-0279) ----------
// The chips a card carries, each removable, plus an input that offers the labels
// already in use. A <datalist> is the whole of that offer: typing a name nobody
// has used is how a label is created, and the picker is what keeps `ui` and `UI`
// from both appearing by accident (agents/PROTOCOL.md, "Label names").
//
// It takes the list and the datalist's id rather than a task, because the "+"
// form has chips before it has a task (T-0282): the markup, the offer and the
// gesture are one thing there and here, and only the write path differs.
// `inputId` is optional and exists for the form, where the field is introduced
// by a <label for="..."> like every other one; the card's dialog names its own
// area through the <dt> beside it and passes nothing.
function labelEditorHtml(labels, listId, inputId) {
  const options = labelsInUse()
    .filter((label) => !labels.includes(label))
    .map((label) => `<option value="${esc(label)}"></option>`)
    .join('');
  const chips = labels
    .map((label) => {
      const drop = tFill('labels_remove', { label });
      return (
        `<span class="label-chip">${esc(label)}` +
        `<button class="label-drop" type="button" data-label-drop="${esc(label)}"` +
        ` title="${esc(drop)}" aria-label="${esc(drop)}">×</button></span>`
      );
    })
    .join('');
  return (
    `<div class="label-editor">` +
    (chips || `<span class="empty">${esc(t('empty_labels'))}</span>`) +
    `<input type="text"${inputId ? ` id="${esc(inputId)}"` : ''} data-label-add list="${listId}"` +
    ` placeholder="${esc(t('labels_add_placeholder'))}">` +
    `<datalist id="${listId}">${options}</datalist></div>`
  );
}

function wireLabelEditor(overlay, task) {
  const labels = (task.labels || []).slice();
  overlay.querySelectorAll('[data-label-drop]').forEach((el) =>
    el.addEventListener('click', () =>
      setTaskLabels(task.id, labels.filter((label) => label !== el.dataset.labelDrop))
    )
  );
  const input = overlay.querySelector('[data-label-add]');
  if (!input) return;
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.preventDefault) e.preventDefault();
    const name = String(input.value || '').trim();
    input.value = '';
    // A name the task already carries is not a second label - the shared
    // normalizer would collapse it anyway, and posting for nothing would repaint
    // every open board.
    if (!name || labels.includes(name)) return;
    setTaskLabels(task.id, labels.concat([name]));
  });
}

// The dialog's editor catches up with the board, the way its session area
// already does (refreshOpenTaskSessions): the write posts the whole list and
// patches nothing itself, so this is where a chip just added actually appears.
//
// Repainted only when the list really changed, because this runs on every board
// update — an unconditional rewrite would throw away a name being typed at the
// moment some unrelated task was written.
function refreshOpenTaskLabels() {
  for (const overlay of modals) {
    if (!overlay._task) continue;
    const fresh = tasks.find((x) => x.id === overlay._task.id);
    if (!fresh) continue;
    const area = overlay.querySelector('[data-label-area]');
    if (!area) continue;
    const drawn = (fresh.labels || []).join(',');
    if (area.dataset.labels === drawn) continue;
    area.dataset.labels = drawn;
    area.innerHTML = labelEditorHtml(fresh.labels || [], 'label-options-' + fresh.id);
    wireLabelEditor(overlay, fresh);
  }
}

// One field, one request, and the whole list every time: replacing it is the
// only shape the endpoint has, and there is nothing to merge on the client.
// The board is repainted by the SSE "changed" event the write fires.
async function setTaskLabels(id, labels) {
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(id) + '/labels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ labels: labels }),
    });
    if (!r.ok) alert(t(writeErrorKey(r.status, 'labels_failed')));
  } catch {
    alert(t('labels_failed'));
  }
}

// One field, one request: this endpoint changes no status and starts nothing.
// The board is repainted by the SSE "changed" event the write fires, so nothing
// is patched here by hand.
async function setTaskProfile(id, profile) {
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(id) + '/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: profile }),
    });
    if (!r.ok) alert(t(writeErrorKey(r.status, 'profile_failed')));
  } catch {
    alert(t('profile_failed'));
  }
}

// ---------- answering the session's questions (T-0085) ----------
// Shown only inside the dialog of a task the server flagged `awaitingAnswer`.
// The restart box is on by default: reading the questions and answering them is
// what unblocks the session, and letting it run again with the answers is the
// expected next move, not an extra. Its label names the kind that will actually
// be restarted, which the status decides (T-0101, T-0122) exactly as it does on
// the server.
const RESTART_LABEL_KEY = {
  in_progress: 'answer_restart_worker',
  review: 'answer_restart_orchestrator',
};
function answerFormHtml(task) {
  const restartLabel = t(RESTART_LABEL_KEY[task.status] || 'answer_restart');
  return `
    <form class="task-form answer-form" data-answer-form>
      <h3>${esc(t('answer_title'))}</h3>
      <div class="answer-note">${esc(t('answer_hint'))}</div>
      <label for="answer-text">${esc(t('answer_label'))}</label>
      <textarea id="answer-text" maxlength="4000" data-answer-text></textarea>
      <label class="answer-restart"><input type="checkbox" checked data-answer-restart> ${esc(restartLabel)}</label>
      <div class="form-error" role="alert" data-answer-error></div>
      <div class="form-actions">
        <button type="submit" class="tf-btn primary" data-answer-submit>${esc(t('answer_send'))}</button>
      </div>
    </form>`;
}

function wireAnswerForm(overlay, id) {
  overlay.querySelector('.panel').querySelector('[data-answer-form]').addEventListener('submit', (e) => {
    if (e && e.preventDefault) e.preventDefault();
    submitAnswer(overlay, id);
  });
}

async function submitAnswer(overlay, id) {
  const panel = overlay.querySelector('.panel');
  const textEl = panel.querySelector('[data-answer-text]');
  const errorEl = panel.querySelector('[data-answer-error]');
  const text = String(textEl.value || '');
  if (!text.trim()) {
    errorEl.textContent = t('answer_required');
    textEl.classList.add('invalid');
    textEl.focus();
    return;
  }
  textEl.classList.remove('invalid');
  errorEl.textContent = '';
  const payload = { text: text, restart: !!panel.querySelector('[data-answer-restart]').checked };
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(id) + '/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      // The dialog stays open with the typed answer intact - the same rule as
      // the create-task form, and it matters more here: this text was written
      // once and nothing else holds a copy of it.
      errorEl.textContent = t(writeErrorKey(r.status, 'answer_failed'));
      return;
    }
    // The server's write fires the SSE "changed" event and load() repaints the
    // board, so nothing is patched here by hand.
    closeTop();
  } catch {
    errorEl.textContent = t('answer_failed');
  }
}

// ---------- session log (T-0077) ----------
// Opens over the task dialog, on the existing modal stack. Everything below
// writes the log through textContent: it is the output of a process briefboard
// only started, so it is text and is never given to a markup parser.
function openSessionLog(id) {
  const overlay = openModal(`
    <h2>${esc(t('session_log_title'))} ${esc(id)}</h2>
    <div class="log-meta" data-log-meta></div>
    <div class="log-view" data-log-text></div>
    <div class="log-actions">
      <button type="button" class="tf-btn" data-log-refresh>${esc(t('session_log_refresh'))}</button>
      <button type="button" class="tf-btn danger" data-log-stop>${esc(t('session_stop_button'))}</button>
    </div>
    <div class="hint">${t('hint_close')}</div>`);
  overlay._sessionLogId = id;
  const panel = overlay.querySelector('.panel');
  panel.querySelector('[data-log-refresh]').addEventListener('click', () => refreshSessionLog(overlay));
  panel.querySelector('[data-log-stop]').addEventListener('click', () => requestSessionStop(id));
  return refreshSessionLog(overlay);
}

// The stop button exists only while there is something to stop; a finished
// session leaves the log open for reading.
function paintStopButton(overlay) {
  const record = sessionsById.get(overlay._sessionLogId);
  const running = !!record && record.status === 'running';
  const btn = overlay.querySelector('.panel').querySelector('[data-log-stop]');
  btn.style.display = running ? '' : 'none';
  btn.disabled = !running;
}

// An empty log is two different situations (T-0115). Under a live session it is
// the log waiting on an agent that prints everything at exit — a blank pane
// there was read as a broken board. Under a finished one it is the plain fact.
// Told apart by the session's state, never by guessing at the agent's output.
function setLogText(el, text, state) {
  const note = text ? '' : t(state === 'running' ? 'session_log_waiting' : 'session_log_empty');
  el.textContent = text || note;
  el.classList[note ? 'add' : 'remove']('log-note');
}

async function refreshSessionLog(overlay) {
  const id = overlay._sessionLogId;
  const panel = overlay.querySelector('.panel');
  const textEl = panel.querySelector('[data-log-text]');
  const metaEl = panel.querySelector('[data-log-meta]');
  const state = sessionState(id);
  try {
    const r = await fetch('/api/session/' + encodeURIComponent(id) + '/log');
    if (!r.ok) {
      textEl.textContent = '';
      textEl.classList.remove('log-note');
      metaEl.textContent = t(r.status === 404 ? 'session_log_missing' : 'session_log_failed');
      paintStopButton(overlay);
      return;
    }
    const text = await r.text();
    setLogText(textEl, text, state);
    const total = Number(r.headers.get('X-Log-Total-Bytes'));
    const truncated = r.headers.get('X-Log-Truncated') === '1';
    const size = truncated
      ? tFill('session_log_tail', { shown: text.length, total: total })
      : tFill('session_log_size', { total: total });
    metaEl.textContent = (state ? t('session_' + state) + ' · ' : '') + size;
  } catch {
    textEl.textContent = '';
    textEl.classList.remove('log-note');
    metaEl.textContent = t('session_log_failed');
  }
  paintStopButton(overlay);
}

// Every open log view catches up when a session's state changes. Nothing polls:
// the server pushes a 'sessions' SSE event on start and on exit, and a finished
// session sends no further ones.
function refreshOpenSessionLogs() {
  for (const overlay of modals) {
    if (overlay._sessionLogId) refreshSessionLog(overlay);
  }
}

async function requestSessionStop(id) {
  if (!confirm(tFill('session_stop_confirm', { id: id }))) return;
  try {
    const r = await fetch('/api/session/' + encodeURIComponent(id) + '/stop', { method: 'POST' });
    if (!r.ok) {
      alert(t('session_stop_failed'));
      return;
    }
    // Success: the kill makes the session exit, that fires the 'sessions' event,
    // and loadSessions() repaints both the board and this dialog.
  } catch {
    alert(t('session_stop_failed'));
  }
}

async function openBrief(briefId) {
  const overlay = openModal(`<div class="empty">${t('brief_loading')}</div>`);
  try {
    const r = await fetch('/api/brief/' + encodeURIComponent(briefId));
    const data = await r.json();
    overlay.querySelector('.panel').innerHTML = r.ok
      ? `<div class="head"><span class="id">${data.file}</span></div>
         <div class="desc" style="border-top:0;padding-top:4px">${md(data.markdown)}</div>
         <div class="hint">${t('hint_close')}</div>`
      : `<div class="empty">${esc(data.error || t('brief_error'))}</div>`;
  } catch {
    overlay.querySelector('.panel').innerHTML = `<div class="empty">${t('brief_unavailable')}</div>`;
  }
}

// ---------- create a task from the board (T-0074) ----------
// The "+" button opens a dialog whose submit POSTs to /api/task; the server
// re-validates every field and is the only place that assigns the id, so this
// form is pure UX. Domain values (feature/bug/external, Blocker…Minor) are sent
// verbatim and therefore never translated - only the visible labels go through t().
const NEW_TASK_TYPES = ['feature', 'bug', 'external'];
// The datalist of the form's label field. One id, not one per task, because
// there is no task here yet — this dialog is only ever open once at a time.
const NEW_TASK_LABEL_LIST = 'nt-label-options';

function newTaskFormHtml(labels) {
  const priorityOptions = Object.keys(PRIO_ORDER)
    .map((p) => `<option value="${p}"${p === 'Medium' ? ' selected' : ''}>${p}</option>`)
    .join('');
  const typeOptions = NEW_TASK_TYPES.map((ty) => `<option value="${ty}">${ty}</option>`).join('');
  return `
    <h2>${t('new_task_title')}</h2>
    <form class="task-form" id="new-task-form">
      <label for="nt-title">${t('field_title')}</label>
      <input id="nt-title" type="text" maxlength="200" autocomplete="off">
      <label for="nt-type">${t('field_type')}</label>
      <select id="nt-type">${typeOptions}</select>
      <label for="nt-priority">${t('field_priority')}</label>
      <select id="nt-priority">${priorityOptions}</select>
      <label for="nt-labels">${t('field_labels')}</label>
      <div data-nt-labels>${labelEditorHtml(labels || [], NEW_TASK_LABEL_LIST, 'nt-labels')}</div>
      <label for="nt-description">${t('field_description')}</label>
      <textarea id="nt-description" maxlength="4000"></textarea>
      <div class="form-error" id="nt-error" role="alert"></div>
      <div class="form-actions">
        <button type="submit" class="tf-btn primary" id="nt-submit">${t('create_button')}</button>
        <button type="button" class="tf-btn" id="nt-cancel">${t('cancel_button')}</button>
      </div>
    </form>
    <div class="hint">${t('hint_close')}</div>`;
}

// The form's own label chips (T-0282). The card's editor posts every change
// because its task exists; here there is none yet, so the list lives on the
// overlay and goes out once, inside the create request. setTaskLabels() is
// deliberately not reused - there is no id to send it to.
//
// One delegated listener per gesture, on the container, rather than one per chip
// as wireLabelEditor does: the area is rewritten on every add and remove, and
// listeners bound to the chips would have to be re-bound after each repaint.
function wireNewTaskLabels(overlay) {
  const area = overlay.querySelector('[data-nt-labels]');
  if (!area) return;
  const repaint = () => {
    area.innerHTML = labelEditorHtml(overlay._ntLabels, NEW_TASK_LABEL_LIST, 'nt-labels');
  };
  area.addEventListener('click', (e) => {
    const drop = e.target && e.target.closest ? e.target.closest('.label-drop') : null;
    if (!drop) return;
    overlay._ntLabels = overlay._ntLabels.filter((label) => label !== drop.dataset.labelDrop);
    repaint();
  });
  area.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const input = e.target;
    if (!input || !input.dataset || input.dataset.labelAdd === undefined) return;
    // Enter inside this field adds a chip; it must not submit the form, which is
    // what Enter in a form's text input does by default.
    if (e.preventDefault) e.preventDefault();
    const name = String(input.value || '').trim();
    input.value = '';
    // A name already on the form is not a second chip - the shared rules would
    // collapse it anyway (checkLabels), and a repaint for nothing loses nothing
    // but is still a repaint.
    if (!name || overlay._ntLabels.includes(name)) return;
    overlay._ntLabels = overlay._ntLabels.concat([name]);
    repaint();
  });
}

// Which message a failed write earns. 503 is the server saying another writer
// holds the backlog lock (T-0081) — a retry is likely to succeed, so it must not
// read like the general failure. The retry stays the user's: a silent automatic
// one could create the same task twice if the response was merely lost.
function writeErrorKey(status, failedKey) {
  return status === 503 ? 'busy_retry' : failedKey;
}

async function submitNewTask(overlay) {
  const titleEl = overlay.querySelector('#nt-title');
  const errorEl = overlay.querySelector('#nt-error');
  const title = String(titleEl.value || '').trim();
  if (!title) {
    // Nothing is sent for an empty title: report it in place and put the caret
    // back where the fix belongs, keeping everything else the user typed.
    errorEl.textContent = t('title_required');
    titleEl.classList.add('invalid');
    titleEl.focus();
    return;
  }
  titleEl.classList.remove('invalid');
  errorEl.textContent = '';
  // The `||` fallbacks matter only if a <select> somehow has no value; the
  // server rejects an unknown type/priority rather than guessing.
  const payload = {
    title: title,
    type: overlay.querySelector('#nt-type').value || 'feature',
    priority: overlay.querySelector('#nt-priority').value || 'Medium',
    description: String(overlay.querySelector('#nt-description').value || ''),
    // Always sent, empty list included: the server takes [] as "no labels", and
    // the request then says what the form held rather than leaving it to be
    // inferred from an absent key.
    labels: (overlay._ntLabels || []).slice(),
  };
  try {
    const r = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      // Keep the dialog (and everything typed into it) open on failure.
      errorEl.textContent = t(writeErrorKey(r.status, 'create_failed'));
      return;
    }
    // Success: close and re-render nothing by hand - the server's write to
    // doc/backlog.md fires the SSE "changed" event and load() refreshes the
    // board, exactly as the drag&drop cancel flow does.
    closeTop();
  } catch {
    errorEl.textContent = t('create_failed');
  }
}

function openNewTask() {
  const overlay = openModal(newTaskFormHtml([]));
  overlay._ntLabels = [];
  wireNewTaskLabels(overlay);
  const form = overlay.querySelector('#new-task-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitNewTask(overlay);
  });
  overlay.querySelector('#nt-cancel').addEventListener('click', () => closeTop());
  return overlay;
}
document.getElementById('new-task').addEventListener('click', openNewTask);

// ---------- theme toggle ----------
// The icon/label shown is the theme the click would switch TO (the target),
// so the button always advertises the action it performs.
const THEME_TARGET_ICON = { dark: '☀', light: '☾' };

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function paintThemeButton() {
  const theme = currentTheme();
  const target = theme === 'dark' ? 'light' : 'dark';
  const btn = document.getElementById('theme-toggle');
  const label = t('theme_toggle_to_' + target);
  document.getElementById('theme-icon').textContent = THEME_TARGET_ICON[theme];
  btn.title = label;
  btn.setAttribute('aria-label', label);
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) { /* storage unavailable, non-fatal */ }
  paintThemeButton();
}
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
paintThemeButton();

// ---------- exit button (T-0082) ----------
// The final screen: the board is not coming back by itself, so the page says so
// and stops reconnecting instead of sitting in "reconnecting…" forever. Called
// both by the tab that pressed the button and by every other open tab, off the
// SSE 'shutdown' event, so it has to be idempotent.
function showStopped() {
  boardStopped = true;
  if (sse) {
    sse.close();
    sse = null;
  }
  document.getElementById('live').classList.add('off');
  document.getElementById('live-text').textContent = t('live_stopped');
  if (!stoppedScreen) {
    stoppedScreen = document.createElement('div');
    stoppedScreen.className = 'stopped-screen';
    stoppedScreen.setAttribute('role', 'alert');
    stoppedScreen.innerHTML =
      '<div class="stopped-box"><div class="stopped-title"></div><div class="stopped-hint"></div></div>';
    document.body.appendChild(stoppedScreen);
  }
  stoppedScreen.querySelector('.stopped-title').textContent = t('stopped_title');
  stoppedScreen.querySelector('.stopped-hint').textContent = t('stopped_hint');
}

async function exitBoard() {
  if (boardStopped) return;
  if (!confirm(t('exit_confirm'))) return;
  try {
    const r = await fetch('/api/shutdown', { method: 'POST' });
    if (!r.ok) {
      alert(t('exit_failed'));
      return;
    }
  } catch {
    // The process leaves as it answers, so a torn-off response is the expected
    // outcome here, not a failure. Only an explicit refusal (403) is one.
  }
  showStopped();
}
document.getElementById('exit-board').addEventListener('click', exitBoard);

// ---------- language toggle ----------
// Updates the static header labels that live outside render() - the type
// filter chips, the language select, and (when currently offline)
// the live/reconnect indicator. Called once at load and again on every
// language switch.
function applyStaticLabels() {
  document.querySelector('[data-type="all"]').textContent = t('filter_all');
  document.querySelector('[data-type="feature"]').textContent = t('filter_feature');
  document.querySelector('[data-type="bug"]').textContent = t('filter_bug');
  document.querySelector('[data-type="external"]').textContent = t('filter_external');
  const blockedBtn = document.getElementById('blocked-filter');
  blockedBtn.textContent = t('filter_blocked');
  blockedBtn.title = t('filter_blocked_title');
  document.getElementById('export-excel').textContent = t('export_button');
  document.getElementById('search-filter').placeholder = t('search_placeholder');
  // The "+" glyph itself is language-neutral; the word beside it is not. It is
  // its own element because assigning to the button's textContent would wipe
  // out the glyph.
  const newTaskBtn = document.getElementById('new-task');
  const newTaskLabel = t('new_task_button');
  document.getElementById('new-task-label').textContent = newTaskLabel;
  newTaskBtn.title = newTaskLabel;
  newTaskBtn.setAttribute('aria-label', newTaskLabel);
  const langSelect = document.getElementById('lang-toggle');
  langSelect.value = lang;
  const langTitle = t('lang_switch_title');
  langSelect.title = langTitle;
  langSelect.setAttribute('aria-label', langTitle);
  // The glyph is language-neutral, the accessible name is not — as for the theme
  // toggle. The new-task button is not one of these: since T-0137 it carries a
  // visible word beside its glyph.
  const exitBtn = document.getElementById('exit-board');
  const exitLabel = t('exit_button');
  exitBtn.title = exitLabel;
  exitBtn.setAttribute('aria-label', exitLabel);
  const live = document.getElementById('live');
  if (boardStopped) {
    showStopped(); // repaints the final screen in the newly chosen language
  } else if (live.classList.contains('off')) {
    document.getElementById('live-text').textContent = t('reconnecting');
  }
  // Refresh the theme button title/aria-label so it follows the current language.
  paintThemeButton();
}
function setLang(next) {
  lang = next;
  // Keep the <html lang> attribute in sync so screen readers, browser
  // typography/hyphenation and translation heuristics see the real UI language.
  document.documentElement.lang = lang;
  try { localStorage.setItem('lang', lang); } catch (e) { /* storage unavailable, non-fatal */ }
  applyStaticLabels();
  render();
}
document.getElementById('lang-toggle').addEventListener('change', (e) => setLang(e.target.value));
// Apply the language resolved at load (default 'en' or the stored choice) to the
// <html lang> attribute, matching what setLang() does on every later switch.
document.documentElement.lang = lang;
applyStaticLabels();

// ---------- type filter ----------
document.getElementById('type-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.tf-btn');
  if (!btn) return;
  typeFilter = btn.dataset.type;
  document.querySelectorAll('.tf-btn').forEach((b) => b.classList.toggle('active', b === btn));
  render();
});

// ---------- priority filter (T-0044) ----------
// Unlike the type filter above, this is multi-select: each button toggles
// only its own priority in/out of `priorityFilter`, independently of the
// others (checkbox semantics, not radio-button semantics).
document.getElementById('priority-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.prio-toggle');
  if (!btn) return;
  const prio = btn.dataset.priority;
  if (priorityFilter.has(prio)) priorityFilter.delete(prio);
  else priorityFilter.add(prio);
  btn.classList.toggle('active', priorityFilter.has(prio));
  render();
});

// ---------- "blocked only" filter (T-0092) ----------
// A single toggle rather than a third filter group: "blocked" is one boolean
// about a task, and it narrows whatever the other filters already selected.
const blockedFilterBtn = document.getElementById('blocked-filter');
blockedFilterBtn.addEventListener('click', () => {
  blockedOnly = !blockedOnly;
  blockedFilterBtn.classList.toggle('active', blockedOnly);
  blockedFilterBtn.setAttribute('aria-pressed', blockedOnly ? 'true' : 'false');
  render();
});

// ---------- label filter (T-0279) ----------
// A popover of checkboxes rather than a row of buttons like the priority filter:
// that row is fixed at five and this set grows without limit, while the header
// is already clipped below ~1000px (T-0143). Nothing at all is shown while no
// task carries a label — a control whose menu would be empty is noise.
const labelFilterBox = document.getElementById('label-filter');
const labelFilterBtn = document.getElementById('label-filter-btn');
const labelFilterMenu = document.getElementById('label-filter-menu');

function renderLabelFilter() {
  const inUse = labelsInUse();
  // A selection nobody carries any more drops out, the way an empty set already
  // means "inactive": the last task losing a label is what deletes it.
  for (const label of [...labelFilter]) {
    if (!inUse.includes(label)) labelFilter.delete(label);
  }
  labelFilterBox.hidden = inUse.length === 0;
  if (!inUse.length) {
    labelFilterMenu.hidden = true;
    labelFilterBtn.setAttribute('aria-expanded', 'false');
  }
  labelFilterBtn.textContent = labelFilter.size
    ? `${t('filter_labels')} (${labelFilter.size}) ▾`
    : `${t('filter_labels')} ▾`;
  labelFilterBtn.title = t('filter_labels_title');
  labelFilterBtn.classList.toggle('active', labelFilter.size > 0);
  labelFilterMenu.innerHTML = inUse
    .map(
      (label) =>
        `<label><input type="checkbox" data-label-pick="${esc(label)}"` +
        `${labelFilter.has(label) ? ' checked' : ''}><span>${esc(label)}</span></label>`
    )
    .join('');
}

labelFilterBtn.addEventListener('click', () => {
  const open = labelFilterMenu.hidden;
  labelFilterMenu.hidden = !open;
  labelFilterBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
});

// Multi-select, and OR within itself: a task carrying ANY of the ticked labels
// passes, which is what makes ticking a second one widen rather than narrow.
labelFilterMenu.addEventListener('change', (e) => {
  const box = e.target;
  const label = box && box.dataset ? box.dataset.labelPick : null;
  if (!label) return;
  if (labelFilter.has(label)) labelFilter.delete(label);
  else labelFilter.add(label);
  render();
});

// ---------- text search filter (T-0042) ----------
// `input` (not `change`) so filtering happens on every keystroke, without
// waiting for blur. No debounce: filtering an in-memory array is cheap.
document.getElementById('search-filter').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// ---------- XLSX export ----------
// Generates a real .xlsx file (ZIP container + minimal OOXML) from scratch,
// with zero dependencies. This replaces the earlier CSV/TXT heuristics, which
// relied on guessing how desktop Excel detects the column separator/encoding
// of a text file - a real .xlsx is parsed by Excel's native OOXML reader, so
// column splitting is deterministic regardless of locale/version/settings.

// CRC-32 (IEEE 802.3, polynomial 0xEDB88320), table-driven. Used by the ZIP
// writer: computed over the raw (uncompressed) bytes of each part.
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Escapes XML special characters for use inside a text node or attribute, and
// strips control characters that are not valid in XML 1.0 (they may appear in
// task descriptions and would make the file corrupt). Kept characters: \t \n
// \r and everything >= \x20.
function xmlEscape(value) {
  const s = String(value ?? '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

// Only single letters A-Z are needed here (8 columns), so indices > 25 are not
// handled.
function colLetter(n) {
  return String.fromCharCode(65 + n);
}

// The 6 static XLSX parts (everything except the worksheet, which is dynamic).
const XLSX_CONTENT_TYPES =
  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">\n' +
  '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>\n' +
  '<Default Extension="xml" ContentType="application/xml"/>\n' +
  '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>\n' +
  '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>\n' +
  '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>\n' +
  '</Types>';
const XLSX_ROOT_RELS =
  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>\n' +
  '</Relationships>';
const XLSX_WORKBOOK =
  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">\n' +
  '<sheets><sheet name="Tasks" sheetId="1" r:id="rId1"/></sheets>\n' +
  '</workbook>';
const XLSX_WORKBOOK_RELS =
  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">\n' +
  '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>\n' +
  '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>\n' +
  '</Relationships>';
const XLSX_STYLES =
  '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
  '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">\n' +
  '<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>\n' +
  '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>\n' +
  '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>\n' +
  '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>\n' +
  '<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>\n' +
  '</styleSheet>';

// Builds xl/worksheets/sheet1.xml from ALL tasks regardless of the active type
// filter - this is a full backlog dump, not a snapshot of the current board
// view. Columns and getters mirror the previous CSV version (8 columns, same
// order); only the row backend changed from CSV to inline-string XML cells.
function buildSheetXml() {
  const columns = [
    ['xlsx_col_id', (task) => task.id],
    ['xlsx_col_priority', (task) => task.priority],
    ['xlsx_col_title', (task) => task.title],
    ['xlsx_col_description', (task) => task.description || ''],
    ['xlsx_col_brief', (task) => (task.briefs || []).join(', ')],
    // The export is a full backlog dump, and a field it silently omits is a
    // field its reader concludes is empty (T-0279).
    ['xlsx_col_labels', (task) => (task.labels || []).join(', ')],
    ['xlsx_col_status', (task) => statusLabel(task.status)],
    ['xlsx_col_created', (task) => task.created || ''],
    ['xlsx_col_closed', (task) => task.closed || ''],
  ];
  const cell = (colIdx, rowNum, value) =>
    `<c r="${colLetter(colIdx)}${rowNum}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
  const rowsXml = [];
  rowsXml.push(
    `<row r="1">${columns.map(([key], i) => cell(i, 1, t(key))).join('')}</row>`
  );
  tasks.forEach((task, idx) => {
    const rowNum = idx + 2;
    const cells = columns.map(([, get], i) => cell(i, rowNum, get(task))).join('');
    rowsXml.push(`<row r="${rowNum}">${cells}</row>`);
  });
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">\n' +
    '<sheetData>\n' + rowsXml.join('\n') + '\n</sheetData>\n' +
    '</worksheet>';
}

// Packs the given parts into a ZIP archive (stored method, no compression -
// avoids implementing DEFLATE) built from scratch: one local file header +
// data per part, then the central directory, then the end-of-central-directory
// record. Returns a Uint8Array of the whole archive.
// Each file is { name: string, data: Uint8Array }.
function buildZip(files) {
  const encoder = new TextEncoder();
  const now = new Date();
  // DOS date/time packing for the last-modified fields.
  const dosTime = ((now.getHours() & 0x1F) << 11) |
    ((now.getMinutes() & 0x3F) << 5) |
    ((now.getSeconds() >> 1) & 0x1F);
  const dosDate = (((now.getFullYear() - 1980) & 0x7F) << 9) |
    (((now.getMonth() + 1) & 0x0F) << 5) |
    (now.getDate() & 0x1F);

  const localChunks = [];   // bytes of local headers + data, in order
  const centralChunks = []; // bytes of central directory records
  let offset = 0;           // running offset of the next local header

  const entries = files.map((file) => {
    const nameBytes = encoder.encode(file.name);
    const crc = crc32(file.data);
    const size = file.data.length;

    // Local file header (30 bytes fixed + name + extra=0).
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);     // signature PK\x03\x04
    lv.setUint16(4, 20, true);             // version needed to extract
    lv.setUint16(6, 0, true);              // flags
    lv.setUint16(8, 0, true);              // method = 0 (stored)
    lv.setUint16(10, dosTime, true);       // last mod time
    lv.setUint16(12, dosDate, true);       // last mod date
    lv.setUint32(14, crc, true);           // CRC-32
    lv.setUint32(18, size, true);          // compressed size
    lv.setUint32(22, size, true);          // uncompressed size
    lv.setUint16(26, nameBytes.length, true); // file name length
    lv.setUint16(28, 0, true);             // extra field length
    local.set(nameBytes, 30);

    localChunks.push(local, file.data);
    const localHeaderOffset = offset;
    offset += local.length + file.data.length;
    return { nameBytes, crc, size, localHeaderOffset };
  });

  let centralSize = 0;
  entries.forEach((e) => {
    // Central directory record (46 bytes fixed + name + extra=0 + comment=0).
    const central = new Uint8Array(46 + e.nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);     // signature PK\x01\x02
    cv.setUint16(4, 20, true);             // version made by
    cv.setUint16(6, 20, true);             // version needed to extract
    cv.setUint16(8, 0, true);              // flags
    cv.setUint16(10, 0, true);             // method = 0 (stored)
    cv.setUint16(12, dosTime, true);       // last mod time
    cv.setUint16(14, dosDate, true);       // last mod date
    cv.setUint32(16, e.crc, true);         // CRC-32
    cv.setUint32(20, e.size, true);        // compressed size
    cv.setUint32(24, e.size, true);        // uncompressed size
    cv.setUint16(28, e.nameBytes.length, true); // file name length
    cv.setUint16(30, 0, true);             // extra field length
    cv.setUint16(32, 0, true);             // file comment length
    cv.setUint16(34, 0, true);             // disk number start
    cv.setUint16(36, 0, true);             // internal file attributes
    cv.setUint32(38, 0, true);             // external file attributes
    cv.setUint32(42, e.localHeaderOffset, true); // offset of local header
    central.set(e.nameBytes, 46);
    centralChunks.push(central);
    centralSize += central.length;
  });

  const centralOffset = offset;

  // End of central directory record (22 bytes, no comment).
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);       // signature PK\x05\x06
  ev.setUint16(4, 0, true);                // disk number
  ev.setUint16(6, 0, true);                // disk with central directory
  ev.setUint16(8, entries.length, true);   // entries on this disk
  ev.setUint16(10, entries.length, true);  // total entries
  ev.setUint32(12, centralSize, true);     // central directory size
  ev.setUint32(16, centralOffset, true);   // central directory offset
  ev.setUint16(20, 0, true);               // comment length

  const totalSize = offset + centralSize + eocd.length;
  const out = new Uint8Array(totalSize);
  let pos = 0;
  for (const chunk of localChunks) { out.set(chunk, pos); pos += chunk.length; }
  for (const chunk of centralChunks) { out.set(chunk, pos); pos += chunk.length; }
  out.set(eocd, pos);
  return out;
}

function buildXlsx() {
  const encoder = new TextEncoder();
  const parts = [
    { name: '[Content_Types].xml', text: XLSX_CONTENT_TYPES },
    { name: '_rels/.rels', text: XLSX_ROOT_RELS },
    { name: 'xl/workbook.xml', text: XLSX_WORKBOOK },
    { name: 'xl/_rels/workbook.xml.rels', text: XLSX_WORKBOOK_RELS },
    { name: 'xl/styles.xml', text: XLSX_STYLES },
    { name: 'xl/worksheets/sheet1.xml', text: buildSheetXml() },
  ];
  return buildZip(parts.map((p) => ({ name: p.name, data: encoder.encode(p.text) })));
}
function exportXlsx() {
  const blob = new Blob([buildXlsx()], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  });
  const url = URL.createObjectURL(blob);
  const today = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const dateStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `briefboard-tasks-${dateStr}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById('export-excel').addEventListener('click', exportXlsx);

// ---------- drag & drop cancel (backlog/open -> cancelled, T-0017) ----------
// The strip element itself is static (only its innerHTML is replaced by
// render()), so listeners are attached once here, not per-render.
const cancelStrip = document.getElementById('strip-cancelled');
cancelStrip.addEventListener('dragover', (e) => {
  // Ready cards became draggable with T-0084 (into In Progress) but are still
  // not cancellable from the board, so the strip has to refuse them here rather
  // than light up and then drop them on the floor.
  if (!DRAG_CANCELLABLE.includes(draggedStatus)) return;
  e.preventDefault(); // required to allow drop
  e.dataTransfer.dropEffect = 'move';
  cancelStrip.classList.add('drop-target');
});
cancelStrip.addEventListener('dragleave', () => {
  cancelStrip.classList.remove('drop-target');
});
cancelStrip.addEventListener('drop', async (e) => {
  e.preventDefault();
  cancelStrip.classList.remove('drop-target');
  const id = e.dataTransfer.getData('text/plain');
  const task = tasks.find((x) => x.id === id);
  // Client-side check is just a UX guard against a stale drag; the server
  // re-validates the status itself and is the actual source of truth.
  if (!task || !DRAG_CANCELLABLE.includes(task.status)) return;
  if (!confirm(tFill('confirm_cancel', { id: task.id, title: task.title }))) return;
  try {
    const r = await fetch('/api/task/' + encodeURIComponent(id) + '/cancel', { method: 'POST' });
    if (!r.ok) {
      alert(t(writeErrorKey(r.status, 'cancel_failed')));
      return;
    }
    // Success: don't touch the DOM here - the existing SSE "changed" event
    // will fire once the server finishes writing doc/backlog.md, and load()
    // re-renders the whole board from the fresh data.
  } catch {
    alert(t('cancel_failed'));
  }
});

// ---------- drag & drop into Open (backlog -> open, T-0075) ----------
// Called once per Open column element, from buildBoardStructure(). Unlike the
// Cancelled strip this element is created by the UI rather than sitting in the
// static HTML, which is why the wiring is a function instead of top-level code.
//
// Only backlog cards are accepted: for anything else dragover never calls
// preventDefault(), so the browser shows "no drop allowed" and no drop event is
// produced at all. There is deliberately no confirm() here - unlike cancelling,
// moving a card to Open is non-destructive and reversible from the CLI.
function attachOpenDropZone(col) {
  col.addEventListener('dragover', (e) => {
    if (!DRAG_OPENABLE.includes(draggedStatus)) return; // not a backlog card: refuse the drop
    e.preventDefault(); // required to allow drop
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drop-target');
  });
  col.addEventListener('dragleave', () => {
    col.classList.remove('drop-target');
  });
  col.addEventListener('drop', async (e) => {
    e.preventDefault();
    col.classList.remove('drop-target');
    const id = e.dataTransfer.getData('text/plain');
    const task = tasks.find((x) => x.id === id);
    // Client-side check is just a UX guard against a stale drag; the server
    // re-validates the status itself and is the actual source of truth.
    if (!task || !DRAG_OPENABLE.includes(task.status)) return;
    try {
      const r = await fetch('/api/task/' + encodeURIComponent(id) + '/open', { method: 'POST' });
      if (!r.ok) {
        alert(t(writeErrorKey(r.status, 'open_failed')));
        return;
      }
      // Success: don't touch the DOM here - the SSE "changed" event fires once
      // the server has written doc/backlog.md, and load() re-renders the board.
    } catch {
      alert(t('open_failed'));
    }
  });
}

// ---------- drag & drop into In Progress (ready -> in_progress, T-0084) ----------
// Wired exactly like the Open zone, with two differences.
//
// A blocked card (unfinished prerequisites) is refused here: the server rejects
// it with a 409 anyway, and there is no `--force` on the endpoint - overriding a
// dependency stays a CLI decision.
//
// And unlike the Open drop this one asks for confirmation: it starts an agent
// that writes code and commits it. The two texts differ so the confirmation
// never promises a session the server has no command for.
function attachStartDropZone(col) {
  col.addEventListener('dragover', (e) => {
    if (!DRAG_STARTABLE.includes(draggedStatus) || draggedBlocked) return;
    e.preventDefault(); // required to allow drop
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drop-target');
  });
  col.addEventListener('dragleave', () => {
    col.classList.remove('drop-target');
  });
  col.addEventListener('drop', async (e) => {
    e.preventDefault();
    col.classList.remove('drop-target');
    const id = e.dataTransfer.getData('text/plain');
    const task = tasks.find((x) => x.id === id);
    // Client-side checks are just a UX guard against a stale drag; the server
    // re-validates both the status and the dependencies and is the source of truth.
    if (!task || !DRAG_STARTABLE.includes(task.status) || blockingIdsFor(task).length) return;
    const key = sessionsConfigured.worker ? 'confirm_start' : 'confirm_start_no_session';
    if (!confirm(tFill(key, { id: task.id, title: task.title }))) return;
    try {
      const r = await fetch('/api/task/' + encodeURIComponent(id) + '/start', { method: 'POST' });
      if (!r.ok) {
        alert(t(writeErrorKey(r.status, 'start_failed')));
        return;
      }
      // Success: don't touch the DOM here - the SSE "changed" event fires once
      // the server has written doc/backlog.md, and load() re-renders the board.
    } catch {
      alert(t('start_failed'));
    }
  });
}

// ---------- drag & drop back into Backlog (open -> backlog, T-0141) ----------
// The way back down. Wired like the other two zones; what is decided here is the
// confirmation.
//
// The move itself is not confirmed. It is reversible — and cheaply so since this
// task: a card put back keeps its brief, so dragging it into Open again starts no
// second briefing. Asking about a gesture that costs nothing to undo is friction
// on exactly the correction this whole feature exists to make possible.
//
// What IS confirmed is the one part of the move that cannot be undone: a briefing
// session running on the card is stopped, and the tokens it has spent do not come
// back. So the board asks only when it can see such a session, and the question
// names it — the same rule the In Progress drop follows when it picks its text
// from whether a session will really be started.
function attachReturnDropZone(col) {
  col.addEventListener('dragover', (e) => {
    if (!DRAG_RETURNABLE.includes(draggedStatus)) return; // not an open card: refuse the drop
    e.preventDefault(); // required to allow drop
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drop-target');
  });
  col.addEventListener('dragleave', () => {
    col.classList.remove('drop-target');
  });
  col.addEventListener('drop', async (e) => {
    e.preventDefault();
    col.classList.remove('drop-target');
    const id = e.dataTransfer.getData('text/plain');
    const task = tasks.find((x) => x.id === id);
    // Client-side check is just a UX guard against a stale drag; the server
    // re-validates the status itself and is the actual source of truth.
    if (!task || !DRAG_RETURNABLE.includes(task.status)) return;
    if (sessionState(id) === 'running' &&
        !confirm(tFill('confirm_return_session', { id: task.id, title: task.title }))) return;
    try {
      const r = await fetch('/api/task/' + encodeURIComponent(id) + '/backlog', { method: 'POST' });
      if (!r.ok) {
        alert(t(writeErrorKey(r.status, 'return_failed')));
        return;
      }
      // Success: don't touch the DOM here - the SSE "changed" event fires once
      // the server has written doc/backlog.md, and load() re-renders the board.
    } catch {
      alert(t('return_failed'));
    }
  });
}

// ---------- data + live reload ----------
// The name comes from the server's folder name or BRIEFBOARD_NAME, i.e. from
// whoever started the board — a project directory called `<img onerror=...>`
// must show up as text. Hence textContent and document.title only, never
// innerHTML. The name is user data and is not translated.
const BASE_TITLE = 'briefboard · doc/backlog.md';
function setProjectName(name) {
  const text = typeof name === 'string' ? name.trim() : '';
  document.getElementById('project-name').textContent = text ? '· ' + text + ' ' : '';
  // Name first: a narrow tab truncates the tail, and the name is the part that
  // says which project's backlog this is.
  document.title = text ? text + ' · briefboard' : BASE_TITLE;
}

// Which version of the board `tasks` reflects (T-0160). -1 = nothing loaded, so
// no delta can apply and the next event pulls the whole list.
let boardVersion = -1;
// The newest full load issued, and the highest version any event announced. The
// first discards a response that a later load has already superseded; the second
// catches events that arrived while a load was in flight and are therefore not
// in it.
let loadSeq = 0;
let seenVersion = -1;
// The announced version a re-read was already issued for. One retry per
// announcement and no more: a server answering older than it announces would
// otherwise be met with an endless stream of requests, and the next event
// re-syncs the board anyway.
let resyncedFor = -1;

async function load() {
  const seq = ++loadSeq;
  try {
    const r = await fetch('/api/board');
    const data = await r.json();
    if (seq !== loadSeq) return;
    const version = typeof data.version === 'number' ? data.version : -1;
    // A delta applied while this was in flight already carried the board past
    // this snapshot; overwriting with it would be a step backwards.
    if (version >= 0 && version < boardVersion) return;
    tasks = data.tasks || [];
    boardError = typeof data.error === 'string' && data.error ? data.error : null;
    boardVersion = version;
    sessionsConfigured =
      data.sessions || { enabled: false, worker: false, orchestrator: false, profiles: [], profileUsedBy: {} };
    setProjectName(data.project && data.project.name);
    render();
    // An event announced a version this answer does not contain yet: ask again.
    // Only against a real version — a board served without one (the backlog is
    // unreadable) would otherwise be re-requested forever.
    if (version >= 0 && seenVersion > version && resyncedFor !== seenVersion) {
      resyncedFor = seenVersion;
      load();
    }
  } catch { /* server restarting; SSE reconnect will retrigger */ }
}

// A board event carries the delta as JSON: "changed {...}". Applying it needs
// the client to be at exactly the version the delta was built from; anything
// else — a missed frame, a reconnect, a payload too large to send, an older
// server sending the bare word — reloads everything. One reload too many costs
// a request; one too few leaves the board silently showing yesterday's status.
function onBoardEvent(data) {
  const payload = data.slice('changed'.length).trim();
  let msg = null;
  if (payload) {
    try { msg = JSON.parse(payload); } catch { /* unparseable: treat as unknown */ }
  }
  if (!msg) { load(); return; }
  if (typeof msg.v === 'number' && msg.v > seenVersion) seenVersion = msg.v;
  if (typeof msg.v === 'number' && msg.v === boardVersion) return; // already current
  if (msg.full || msg.base !== boardVersion) { load(); return; }
  const removed = new Set(msg.removed || []);
  const updated = new Map((msg.tasks || []).map((task) => [task.id, task]));
  const next = [];
  for (const task of tasks) {
    if (removed.has(task.id)) continue;
    const fresh = updated.get(task.id);
    if (fresh) updated.delete(task.id);
    next.push(fresh || task);
  }
  // What is left is new, and goes to the end — where the backlog file grows too.
  for (const task of updated.values()) next.push(task);
  tasks = next;
  boardVersion = msg.v;
  render();
}

// Its own request, on its own event: /api/board is cached against the backlog's
// mtime+size, and a session that starts or dies changes neither (T-0077).
async function loadSessions() {
  try {
    const r = await fetch('/api/sessions');
    const data = await r.json();
    sessionsById = new Map((data.sessions || []).map((s) => [s.id, s]));
    costsById = new Map(Object.entries(data.costs || {}));
    const watch = data.watchdog || {};
    watchdogById = new Map(Object.entries(watch.findings || {}));
    watchdogHead = watch.head || null;
    render();
    refreshOpenSessionLogs();
    refreshOpenTaskSessions();
  } catch { /* server restarting; SSE reconnect will retrigger */ }
}

function connect() {
  if (boardStopped) return;
  const es = new EventSource('/events');
  sse = es;
  const live = document.getElementById('live');
  es.onmessage = (e) => {
    const data = String(e.data == null ? '' : e.data);
    if (data === 'sessions') loadSessions();
    else if (data === 'shutdown') showStopped();
    else if (data === 'changed' || data.startsWith('changed ')) onBoardEvent(data);
  };
  es.onopen = () => {
    live.classList.remove('off');
    document.getElementById('live-text').textContent = 'live';
    // The full resync every reconnect owes the user: any number of events may
    // have been missed while the stream was down. The versions are forgotten
    // first because the stream may have come back on a restarted process, whose
    // counter starts over — held on to, they would reject the fresh board as
    // older than what is on screen.
    boardVersion = -1;
    seenVersion = -1;
    resyncedFor = -1;
    load();
    loadSessions();
  };
  es.onerror = () => {
    // A drop that is not the board's own exit stays "reconnecting…": the two
    // must not look alike, or a deliberate stop reads as a failure (T-0082).
    if (boardStopped) return;
    live.classList.add('off');
    document.getElementById('live-text').textContent = t('reconnecting');
  };
}

load();
loadSessions();
connect();
</script>
</body>
</html>
