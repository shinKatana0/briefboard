<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>briefboard · doc/backlog.md</title>
<script>
  // Resolve the theme as early as possible (before first paint) to avoid a
  // flash of the wrong theme: explicit user choice from localStorage wins,
  // otherwise fall back to the OS-level color-scheme preference.
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var theme = (stored === 'light' || stored === 'dark')
        ? stored
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      // localStorage/matchMedia unavailable (e.g. privacy mode) - keep the
      // static "dark" default already set on <html>.
    }
  })();
</script>
<style>
  :root {
    /* theme-independent tokens: status/priority hues and chip ink stay the
       same regardless of light/dark page theme (see T-0005-02 brief) */
    --st-backlog: #6B7684;
    --st-open: #4E9AF1;
    --st-ready: #84CC16;
    --st-in_progress: #E0A33B;
    --st-review: #A78BFA;
    --st-done: #43A467;
    --st-cancelled: #59616B;
    --p0: #E5544B; --p1: #E0A33B; --p2: #4E9AF1; --p3: #6B7684;
    --prio-blocker: #C0392B; --prio-critical: #E5544B; --prio-major: #E0A33B;
    --prio-medium: #84CC16; --prio-minor: #6B7684;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    /* ink color used on top of saturated chip backgrounds (prio/status chips) */
    --chip-ink: #0E1116;
  }
  :root[data-theme="dark"] {
    --bg: #0E1116;
    --surface: #161B22;
    --surface-2: #1C232C;
    --border: #232B36;
    --text: #DCE3EB;
    --muted: #7D8894;
    --surface-inset: #10151B;
    --overlay: rgba(5,8,12,.62);
  }
  :root[data-theme="light"] {
    --bg: #E9EDF3;
    --surface: #FFFFFF;
    --surface-2: #F1F4F8;
    --border: #C7D0DA;
    --text: #1B222B;
    --muted: #5B6572;
    --surface-inset: #EDF0F4;
    --overlay: rgba(17,24,33,.45);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---- header ---- */
  /* Wrapping, not clipping (T-0178): `main` scrolls sideways when .board is
     wider than the window, the header sits outside it and cannot, so a fixed
     row hid the search box, the export, the language, the theme and the exit
     button below ~1000px — measured with tools/screenshot.mjs at 800px, and at
     900px in Japanese, where the labels are wider. Wrapping keeps every control
     reachable without a second scroll axis to discover. */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px;
    padding: 14px 20px 10px; border-bottom: 1px solid var(--border);
  }
  header h1 { font: 600 15px/1 var(--mono); letter-spacing: .02em; }
  header h1 .path { color: var(--muted); font-weight: 400; }
  /* The project name is what tells two boards apart, so it keeps the full
     text colour while the rest of the subtitle stays muted. */
  header h1 .project { color: var(--text); font-weight: 400; }
  #live { font: 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st-done); }
  #live.off .dot { background: var(--p0); }

  .type-filter { display: flex; gap: 6px; }
  .tf-btn {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 9px 2px; cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  .tf-btn:hover { border-color: #2E3945; color: var(--text); }
  .tf-btn.active { background: var(--st-open); color: var(--chip-ink); border-color: var(--st-open); }

  /* Priority filter (T-0044): visually tf-btn-like, but its own class since the
     interaction differs - each button toggles independently (checkbox-style,
     multi-select) rather than the type filter's single exclusive selection, so
     it must not be swept up by the type filter's `.tf-btn` reset-then-activate
     click handler. Inactive state mirrors the neutral .tf-btn look; active
     state fills with that priority's own hue (same tokens as the .prio chips
     on cards) so the selected state reads with the same color language. */
  .priority-filter { display: flex; gap: 6px; }
  .prio-toggle {
    font: 700 12px var(--mono); line-height: 1;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px 2px; cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  .prio-toggle:hover { border-color: #2E3945; color: var(--text); }
  .prio-toggle.active { color: var(--chip-ink); }
  .prio-toggle.active[data-priority="Blocker"] { background: var(--prio-blocker); border-color: var(--prio-blocker); }
  .prio-toggle.active[data-priority="Critical"] { background: var(--prio-critical); border-color: var(--prio-critical); }
  .prio-toggle.active[data-priority="Major"] { background: var(--prio-major); border-color: var(--prio-major); }
  .prio-toggle.active[data-priority="Medium"] { background: var(--prio-medium); border-color: var(--prio-medium); }
  .prio-toggle.active[data-priority="Minor"] { background: var(--prio-minor); border-color: var(--prio-minor); }

  /* "Blocked only" toggle (T-0092). Deliberately not a .tf-btn: the type
     filter's click handler resets `active` on every .tf-btn it finds, so a
     blocked toggle wearing that class would be switched off by an unrelated
     click on Feature/Bug. Its active hue is the blocked marker's own, so the
     filter and the cards it keeps read as the same thing. */
  .blocked-toggle {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 9px 2px; cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  .blocked-toggle:hover { border-color: #2E3945; color: var(--text); }
  .blocked-toggle.active { background: var(--prio-blocker); color: var(--chip-ink); border-color: var(--prio-blocker); }

  /* Label filter (T-0279). A popover and not a row of buttons like
     .priority-filter: that row is fixed at five and this set grows without
     limit, while the header is already clipped below ~1000px (T-0143). Same
     reason it is not a .tf-btn - the type filter's handler resets `active` on
     every .tf-btn it finds. */
  .label-filter { position: relative; }
  .label-filter-btn {
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 9px 2px; cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  .label-filter-btn:hover { border-color: #2E3945; color: var(--text); }
  .label-filter-btn.active { background: var(--st-open); border-color: var(--st-open); color: var(--chip-ink); }
  .label-filter-menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
    min-width: 160px; max-height: 320px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .label-filter-menu[hidden] { display: none; }
  .label-filter-menu label {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    font: 12px var(--mono); color: var(--text); padding: 3px 4px; border-radius: 4px;
  }
  .label-filter-menu label:hover { background: var(--surface-2); }
  .label-filter-menu input { width: auto; margin: 0; }

  /* Search box (T-0042): shares the .tf-btn look (mono font, theme surface/
     border/colors) with the type filter so both read as one "filtering"
     cluster, but needs its own overrides since it holds free-form typed text
     rather than a short fixed label. The extra margin-right pulls #export-excel
     visually away, marking it as the separate, non-filter action. */
  .search-input {
    text-transform: none; letter-spacing: normal; cursor: text;
    width: 200px; margin-right: 14px;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: none; border-color: var(--st-open); color: var(--text); }
  /* Native WebKit clear ("x") button on type=search inputs - recolor to match theme. */
  .search-input::-webkit-search-cancel-button { filter: grayscale(1); opacity: .7; }

  #lang-toggle { margin-left: auto; }
  #theme-toggle { font-size: 13px; line-height: 1; padding: 3px 8px 2px; }
  /* Destructive, so it only turns red under the pointer: a permanently red
     button in the header would read as an alarm on a healthy board. */
  #exit-board { font-size: 13px; line-height: 1; padding: 3px 8px 2px; }
  #exit-board:hover { color: var(--p0); border-color: color-mix(in srgb, var(--p0) 55%, transparent); }
  /* The "+" glyph reads as the action, the word beside it says which action
     (T-0137). Only the glyph is enlarged - sizing the word too would make the
     button taller than the rest of the header row - and the explicit
     line-height keeps that larger glyph inside the same box as a plain
     .tf-btn label. */
  #new-task { display: inline-flex; align-items: baseline; gap: 6px; line-height: 14px; }
  #new-task-glyph { font-size: 15px; }

  /* #lang-toggle is a <select>, not a <button>: reset UA chrome and re-apply
     .tf-btn look explicitly so browser default select styling can't win. */
  select#lang-toggle {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 20px 2px 9px; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  select#lang-toggle:hover { border-color: #2E3945; color: var(--text); }

  /* ---- board ----
     Vertical scroll lives inside each column's .cards box (T-0043), not on
     `main` anymore: `main` keeps overflow:auto so it can still scroll
     vertically for the done/cancelled strips below the board (and
     horizontally when .board's min-width exceeds the viewport), but with
     hundreds of cards in a single column the board itself no longer forces
     that scroll - only the offending column's .cards grows a scrollbar. */
  main { flex: 1; overflow: auto; padding: 16px 20px 28px; }
  .board {
    display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr));
    gap: 14px; align-items: start; min-width: 1140px;
  }
  .col-head {
    font: 600 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em;
    padding: 4px 2px 10px; display: flex; align-items: baseline; gap: 7px;
    position: sticky; top: -16px; background: var(--bg); z-index: 1;
  }
  .col-head .hash { color: var(--muted); font-weight: 400; }
  .col-head .count { color: var(--muted); font-weight: 400; margin-left: auto; }
  .col { display: flex; flex-direction: column; }
  /* Board column as a drop target (T-0075, backlog -> open). Same two-stage
     highlight as the strips below, but under its own `.col` selector and in the
     Open column's own color, so the strip rules keep theirs untouched. */
  /* `align-self: stretch` and not a height of its own (T-0112): it fills the
     grid row the tallest column already sets, so it never changes that row's
     height. A min-height would, and would push the Cancelled strip - the second
     zone of the same drag - out from under the cursor heading for it. */
  .col.drag-available {
    align-self: stretch;
    outline: 2px dashed color-mix(in srgb, var(--st-open) 70%, transparent);
    border-radius: 6px;
  }
  .col.drop-target {
    outline: 2px solid var(--st-open); outline-offset: 0; border-radius: 6px;
    background: color-mix(in srgb, var(--st-open) 20%, transparent);
  }
  /* The head is opaque (it is sticky, cards scroll under it), so it repeats the
     fill instead of cutting a hole across the top of it. */
  .col.drop-target .col-head { background: color-mix(in srgb, var(--st-open) 20%, var(--bg)); }
  /* The second drop column (T-0084, ready -> in_progress) reuses those two
     stages and only repaints them in its own status color. */
  .col.drop-start.drag-available { outline-color: color-mix(in srgb, var(--st-in_progress) 70%, transparent); }
  .col.drop-start.drop-target { outline-color: var(--st-in_progress); background: color-mix(in srgb, var(--st-in_progress) 20%, transparent); }
  .col.drop-start.drop-target .col-head { background: color-mix(in srgb, var(--st-in_progress) 20%, var(--bg)); }
  /* And the third (T-0141, open -> backlog), the one that moves a card leftwards. */
  .col.drop-back.drag-available { outline-color: color-mix(in srgb, var(--st-backlog) 70%, transparent); }
  .col.drop-back.drop-target { outline-color: var(--st-backlog); background: color-mix(in srgb, var(--st-backlog) 20%, transparent); }
  .col.drop-back.drop-target .col-head { background: color-mix(in srgb, var(--st-backlog) 20%, var(--bg)); }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
  /* Scoped to board columns (not `.strip .cards`, which keeps scrolling with
     the page as before). max-height (not height) is load-bearing: it caps
     tall columns without stretching short/empty ones, so a nearly-empty
     column still shrinks to its content instead of showing a scrollbar or
     dead space. The subtracted amount is header + main's top padding +
     .col-head, plus a bit of breathing room, so the header and all 5
     column titles stay on screen without scrolling `main`. */
  .col .cards {
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    /* keep the scrollbar itself theme-aware instead of hardcoding colors */
    scrollbar-color: var(--border) transparent;
  }
  .col .cards::-webkit-scrollbar { width: 9px; }
  .col .cards::-webkit-scrollbar-track { background: transparent; }
  .col .cards::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
  .col .cards::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--muted); border-radius: 6px;
    padding: 9px 11px 8px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .card[draggable="true"] { cursor: grab; }
  .card:hover, .card:focus-visible { background: var(--surface-2); outline: none; border-color: #2E3945; }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--st-open); }
  /* Wrapping is load-bearing since T-0092: the blocked marker now carries a
     blocker title, so the row can hold more than fits one line of a 220px
     column. It wraps instead of pushing the chips off the card. */
  .card .top { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; margin-bottom: 5px; }
  .id { font: 500 11.5px var(--mono); color: var(--muted); background: var(--surface-inset); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .prio { font: 700 10px var(--mono); border-radius: 4px; padding: 2px 5px 1px; color: var(--chip-ink); }
  .prio.Blocker { background: var(--prio-blocker); } .prio.Critical { background: var(--prio-critical); }
  .prio.Major { background: var(--prio-major); } .prio.Medium { background: var(--prio-medium); }
  .prio.Minor { background: var(--prio-minor); color: #DCE3EB; }
  .tag-bug { font: 600 10px var(--mono); color: var(--p0); border: 1px solid color-mix(in srgb, var(--p0) 50%, transparent); border-radius: 4px; padding: 1px 5px; }
  /* Type tag for `external` (T-0092), same chip shape as .tag-bug in its own
     hue - a card must never leave "we are waiting on someone else" looking like
     a bug we could go and fix. */
  .tag-external { font: 600 10px var(--mono); color: var(--st-review); border: 1px solid color-mix(in srgb, var(--st-review) 50%, transparent); border-radius: 4px; padding: 1px 5px; }
  /* Labels (T-0279) get a row of their own under the title, never the `.top`
     row: that row carries exceptional state - blocked, awaiting an answer, a
     session, the watchdog - and a label is ordinary classification that must not
     read as an alarm. No colour of their own either (the board's rule from
     T-0144 is "label and place, no colour spent"); a palette per label is a
     separate decision nobody has asked for. */
  .card .labels { display: flex; flex-wrap: wrap; gap: 4px 5px; margin-top: 6px; }
  .label-chip {
    font: 500 10px var(--mono); color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
    background: var(--surface-inset);
  }
  .card .title { font-size: 13.5px; font-weight: 500; }
  .card.closed-task .title { color: var(--muted); }
  .card .foot { display: flex; gap: 10px; margin-top: 7px; font: 11px var(--mono); color: var(--muted); }

  /* done / cancelled strips */
  .strip { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 10px; min-width: 1140px; }
  /* "available target" - shown for the whole drag, weaker than the hover state below */
  .strip.drag-available {
    min-height: 120px;
    outline: 2px dashed color-mix(in srgb, var(--st-cancelled) 70%, transparent);
    border-radius: 6px;
  }
  /* Grey --st-cancelled needs a bigger share than the columns' blue and amber to
     read as a fill at all against either theme's background. */
  .strip.drop-target {
    outline: 2px solid var(--st-cancelled); outline-offset: 0; border-radius: 6px;
    background: color-mix(in srgb, var(--st-cancelled) 35%, transparent);
  }
  .strip summary {
    cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 7px;
    font: 600 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 2px 10px;
  }
  .strip summary::-webkit-details-marker { display: none; }
  .strip summary .chev { color: var(--muted); transition: transform .15s; display: inline-block; }
  .strip[open] summary .chev { transform: rotate(90deg); }
  .strip .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }

  /* ---- modals ---- */
  .overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 7vh 16px 16px; z-index: 10;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    width: min(720px, 100%); max-height: 84vh; overflow: auto; padding: 20px 24px 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  /* The panel takes focus (tabindex="-1") when a dialog opens; suppress the
     focus ring on the container itself - inner controls keep their own. */
  .panel:focus { outline: none; }
  .panel .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  .panel h2 { font-size: 17px; font-weight: 600; margin: 2px 0 14px; }
  .status-chip { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; border-radius: 4px; padding: 3px 7px 2px; color: var(--chip-ink); }
  .meta { display: grid; grid-template-columns: 120px 1fr; gap: 5px 12px; font-size: 13px; margin-bottom: 14px; }
  .meta dt { color: var(--muted); font: 12px var(--mono); padding-top: 1px; }
  .brief-link {
    font: 500 12px var(--mono); color: var(--st-open); background: var(--surface-inset);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
    cursor: pointer; margin: 0 6px 4px 0; display: inline-block;
  }
  .brief-link:hover { border-color: var(--st-open); }
  /* Dependency chip in the task dialog (T-0087): the brief-link shape, plus the
     prerequisite's current status so "is it done yet?" needs no second click.
     A cancelled prerequisite unblocks but its premise is gone, so it is struck
     through - visibly not the same thing as a finished one. */
  .dep-link { display: inline-flex; align-items: baseline; gap: 6px; }
  .dep-link.dep-cancelled .dep-id { text-decoration: line-through; }
  .dep-link .dep-status { font-size: 11px; }
  /* Card marker for a task whose prerequisites are not closed yet. The text is
     already cut to a character budget before it gets here; the ellipsis rules
     are the second line of defence for a narrow column, where even the budgeted
     text would not fit. */
  .blocked-flag {
    font: 600 10px var(--mono); color: var(--prio-blocker);
    border: 1px solid color-mix(in srgb, var(--prio-blocker) 50%, transparent);
    border-radius: 4px; padding: 1px 5px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Card marker for a task whose agent session left questions in the description
     (T-0083). Its own hue on purpose: "waiting for a human answer" is neither
     the blocked marker's red nor the live-session indicator T-0077 adds, and all
     three can land on one card at once. */
  .awaiting-flag {
    font: 600 10px var(--mono); color: var(--prio-major);
    border: 1px solid color-mix(in srgb, var(--prio-major) 50%, transparent);
    border-radius: 4px; padding: 1px 5px;
  }
  /* Card marker for the agent session running on this task (T-0077). At 10px a
     fourth hue would not reliably separate it from the two markers above, so
     what marks the whole family is the leading dot: only this marker has one,
     and only a live session's dot pulses. The card's .top row wraps, so all
     three markers on one card push the title down instead of overflowing. */
  .session-flag {
    font: 600 10px var(--mono); border-radius: 4px; padding: 1px 5px;
    border: 1px solid; display: inline-flex; align-items: center; gap: 4px;
  }
  .session-flag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .session-flag.running { color: var(--st-open); border-color: color-mix(in srgb, var(--st-open) 50%, transparent); }
  .session-flag.running .dot { animation: session-pulse 1.4s ease-in-out infinite; }
  .session-flag.ended { color: var(--muted); border-color: var(--border); }
  /* --p0, not the blocked marker's --prio-blocker: two red markers can share a
     card, and they must not read as one. */
  .session-flag.failed { color: var(--p0); border-color: color-mix(in srgb, var(--p0) 50%, transparent); }
  /* Amber, between "ended" and "failed": the session was cut short with the
     board, which is neither a clean finish nor the agent's own error (T-0102). */
  .session-flag.interrupted { color: var(--p1); border-color: color-mix(in srgb, var(--p1) 50%, transparent); }
  @keyframes session-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* Card marker for a running session whose process tree the board has just
     failed to read (T-0236, T-0242). Dashed and muted, alone among the markers:
     the four above are properties of the task or of its session, while this one
     is a hole in what the board knows about itself — a dashed outline says
     "incomplete" without spending a hue, and a hue here would be read as a
     status the task does not have. It only ever lands on a card that already
     carries the live-session dot, so it must not compete with it either. */
  .tree-flag {
    font: 600 10px var(--mono); color: var(--muted);
    border: 1px dashed var(--border); border-radius: 4px; padding: 1px 5px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* The watchdog's mark (T-0159): the board's own observation that the status
     and what git shows do not agree. Filled where the other three markers are
     outlined — at 10px a fifth outline hue would just be a fourth shade of the
     same thing, while a solid chip reads as a different voice: not a property of
     the task, but the board speaking about it. Amber, not red: this is something
     to look at, not something that is broken. It appears on at most a handful of
     cards, so it can afford to be the loudest thing on one. */
  .watch-flag {
    font: 600 10px var(--mono); background: var(--p1); color: var(--chip-ink);
    border-radius: 4px; padding: 1px 5px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The same finding written out in the dialog, where there is room for the
     whole sentence and where the person who has to act on it is looking. A
     tooltip alone would be unreachable on a touch screen and easy to miss. */
  .watch-note {
    border: 1px solid color-mix(in srgb, var(--p1) 50%, transparent);
    border-left: 3px solid var(--p1);
    border-radius: 6px; padding: 8px 12px; margin: 14px 0;
    background: color-mix(in srgb, var(--p1) 7%, transparent);
  }
  .watch-note h3 { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--p1); }
  .watch-note p { font-size: 13px; color: var(--text); margin-top: 4px; }

  /* ---- session log modal (T-0077) ---- */
  /* The log is foreign output: it is put here with textContent and is never
     parsed as markup, so this box only has to keep its line breaks readable. */
  .log-view {
    font: 12px/1.5 var(--mono); color: var(--text); background: var(--surface-inset);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    max-height: 52vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  /* The board's own words in the log pane, not the agent's: set apart so the
     two are never read as one text (T-0115). */
  .log-view.log-note { font: 12px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); }
  .log-meta { font: 11px var(--mono); color: var(--muted); margin-bottom: 8px; }
  .log-actions { display: flex; gap: 8px; margin-top: 12px; }
  .log-actions button { padding: 4px 12px 3px; }
  .log-actions .danger { color: var(--p0); border-color: color-mix(in srgb, var(--p0) 50%, transparent); }
  .session-row { margin-bottom: 14px; }

  /* ---- the session a card can start (T-0122, T-0141, T-0144) ----
     A caption, what the session does, and the action on a line of its own —
     the same inset panel the closing and cost blocks use, so the card keeps one
     idiom for "a block about this task". It is found by its label and its place
     and never by colour: on this board colour means status, and an accent spent
     on a control would compete with the card's own status hue (T-0145). The
     button drops the .tf-btn uppercase chip size for sentence case, which is
     what separates it from the small reference chips above it. */
  .card-action {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px; background: var(--surface-inset);
  }
  .card-action h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .card-action-what { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  /* A block with nothing to press: what it says IS the whole of it (T-0242). */
  .card-action-what:last-child { margin-bottom: 0; }
  .card-action-row button { font-size: 12px; text-transform: none; letter-spacing: normal; padding: 5px 14px 4px; }
  /* Said where the action would have been, not in place of the whole block: the
     board knows the session is impossible here and says which variable turns it
     on (T-0144). */
  .card-action-why { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  /* ---- closing the loop (T-0117, T-0148) ---- */
  /* Reference AND controls: the board checks git, accepts the task and removes
     the worktree. The one thing it still never does is merge — that line is
     drawn in the block's own text, not by leaving it without buttons. */
  .closing {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px; background: var(--surface-inset);
  }
  .closing h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .closing dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 8px; }
  .closing dt { font: 11px var(--mono); color: var(--muted); }
  /* user-select so the path is easy to grab; anywhere-wrap so a long Windows
     path does not push the dialog sideways. */
  .closing dd { margin: 0; font: 12px var(--mono); color: var(--text); user-select: text; overflow-wrap: anywhere; }
  .closing-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
  /* What git says, in the three colours the board already uses for the states
     they mean: accepted work, work still waiting, nothing known. */
  .closing-state { font: 12px var(--mono); margin-bottom: 8px; }
  .closing-state.merged { color: var(--st-done); }
  .closing-state.unmerged { color: var(--st-review); }
  .closing-state.unknown { color: var(--muted); }
  .closing-hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 6px; }
  .closing-cmd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .closing-cmd code {
    font: 12px var(--mono); background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 7px; user-select: text; overflow-wrap: anywhere;
  }
  .closing-cmd button { padding: 2px 10px 1px; font-size: 11px; }
  .closing-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .closing-actions button { padding: 4px 12px 3px; }
  /* A disabled action still says why, next to itself (T-0121, T-0144). */
  .closing-actions button[disabled] { opacity: .5; cursor: not-allowed; }
  .closing-why { font-size: 12px; color: var(--muted); }

  /* ---- the board speaking about itself (T-0247) ---- */
  /* Not a task and not a status, so it borrows the inset panel every card block
     uses and spends no colour on itself: on this board colour means status, and
     an empty board with no backlog behind it is not one of the five. It sits
     above the columns because the columns are precisely what is misleading —
     five empty ones read as "no tasks yet", which is a different fact. */
  .board-note {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin: 0 0 16px; background: var(--surface-inset);
    max-width: 760px;
  }
  .board-note h2 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .board-note p { font-size: 13px; color: var(--text); line-height: 1.6; margin: 0 0 8px; }
  .board-note p:last-child { margin-bottom: 0; }
  .board-note code {
    font: 12px var(--mono); background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 7px; user-select: text; overflow-wrap: anywhere;
  }

  /* ---- what the task cost (T-0116) ---- */
  /* Same inset panel as the closing block, and next to it: both are what the
     card can tell about the work already done. */
  .cost {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px; background: var(--surface-inset);
  }
  .cost h3 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .cost-total { font: 12.5px var(--mono); color: var(--text); margin-bottom: 6px; }
  .cost-runs { list-style: none; margin: 0; padding: 0; }
  .cost-runs li { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 12px var(--mono); color: var(--muted); padding: 2px 0; }
  .cost-runs .cost-kind { color: var(--text); min-width: 70px; }
  .cost-runs .cost-time { color: var(--text); }
  .cost-tokens { font: 12.5px var(--mono); color: var(--text); margin-top: 8px; }
  /* The sum is only part of one: said plainly, in the place the number is read. */
  .cost-partial { font-size: 12px; color: var(--p1); line-height: 1.6; margin-top: 8px; }

  .desc { border-top: 1px solid var(--border); padding-top: 12px; font-size: 13.5px; }
  .desc h1, .desc h2, .desc h3 { font-size: 13px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .desc p { margin: 6px 0; } .desc ul { margin: 6px 0 6px 20px; }
  .desc code { font: 12.5px var(--mono); background: var(--surface-inset); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .desc pre { background: var(--surface-inset); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow: auto; margin: 8px 0; }
  .desc pre code { border: 0; padding: 0; background: none; }
  .hint { margin-top: 16px; font: 11px var(--mono); color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }

  /* ---- board stopped screen (T-0082) ---- */
  /* Above the modal stack: once the board is stopped nothing underneath is live
     any more, and the screen is deliberately not dismissable. */
  .stopped-screen {
    position: fixed; inset: 0; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .stopped-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px 26px; width: min(460px, 100%); text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .stopped-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  .stopped-hint { font: 12px/1.7 var(--mono); color: var(--muted); }

  /* ---- new-task form (inside a modal panel) ---- */
  .task-form { display: flex; flex-direction: column; gap: 4px; }
  .task-form label { font: 12px var(--mono); color: var(--muted); margin-top: 10px; }
  .task-form input, .task-form select, .task-form textarea {
    font: 13.5px system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); background: var(--surface-inset);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; width: 100%;
  }
  .task-form textarea { font: 12.5px var(--mono); resize: vertical; min-height: 90px; }
  .task-form input:focus, .task-form select:focus, .task-form textarea:focus {
    outline: none; border-color: var(--st-open);
  }
  .task-form .invalid { border-color: var(--p0); }
  /* The label field is the card dialog's editor, dropped into a form whose
     inputs are all full-width: without this it would take a row of its own
     below the chips instead of sitting beside them (T-0282). */
  .task-form .label-editor input { width: auto; }
  .form-error { min-height: 18px; margin-top: 10px; font: 12px var(--mono); color: var(--p0); }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions button { padding: 5px 14px 4px; }
  .form-actions .primary { background: var(--st-open); border-color: var(--st-open); color: var(--chip-ink); }

  /* ---- run profile (inside the task dialog, T-0108) ---- */
  .profile-select {
    font: 12px var(--mono); color: var(--text); background: var(--surface-inset);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px;
  }
  .profile-select:focus { outline: none; border-color: var(--st-open); }
  /* The honest note under the selector (T-0121): the choice is stored either
     way, so the note explains, it does not disable. */
  .profile-note { font: 11px var(--mono); color: var(--muted); margin-top: 4px; max-width: 46em; }

  /* ---- label editor (inside the task dialog, T-0279) ---- */
  .label-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .label-editor .label-chip { display: inline-flex; align-items: center; gap: 5px; }
  .label-editor .label-drop {
    font: 500 11px var(--mono); line-height: 1; color: var(--muted);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .label-editor .label-drop:hover { color: var(--p0); }
  .label-editor input {
    font: 12px var(--mono); color: var(--text); background: var(--surface-inset);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; min-width: 11em;
  }
  .label-editor input:focus { outline: none; border-color: var(--st-open); }

  /* ---- answer form (inside the task dialog, T-0085) ---- */
  .answer-form { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px; }
  .answer-form h3 { font: 12px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
  .answer-form .answer-note { font: 11px var(--mono); color: var(--muted); margin-top: 6px; }
  .answer-form .answer-restart { display: flex; align-items: center; gap: 6px; font: 12px var(--mono); color: var(--muted); margin-top: 10px; }
  .answer-form .answer-restart input { width: auto; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>briefboard <span class="project" id="project-name"></span><span class="path">· doc/backlog.md</span></h1>
  <button id="new-task" class="tf-btn" type="button"><span id="new-task-glyph" aria-hidden="true">+</span><span id="new-task-label"></span></button>
  <div class="type-filter" id="type-filter">
    <button class="tf-btn active" data-type="all">All</button>
    <button class="tf-btn" data-type="feature">Feature</button>
    <button class="tf-btn" data-type="bug">Bug</button>
    <button class="tf-btn" data-type="external">External</button>
  </div>
  <div class="priority-filter" id="priority-filter">
    <button class="prio-toggle" data-priority="Blocker" title="Blocker">⛔</button>
    <button class="prio-toggle" data-priority="Critical" title="Critical">▲</button>
    <button class="prio-toggle" data-priority="Major" title="Major">◆</button>
    <button class="prio-toggle" data-priority="Medium" title="Medium">●</button>
    <button class="prio-toggle" data-priority="Minor" title="Minor">▽</button>
  </div>
  <button id="blocked-filter" class="blocked-toggle" type="button" aria-pressed="false"></button>
  <div class="label-filter" id="label-filter" hidden>
    <button id="label-filter-btn" class="label-filter-btn" type="button" aria-expanded="false"></button>
    <div id="label-filter-menu" class="label-filter-menu" hidden></div>
  </div>
  <input type="search" id="search-filter" class="tf-btn search-input" placeholder="">
  <button id="export-excel" class="tf-btn" type="button">Export Excel</button>
  <select id="lang-toggle" class="tf-btn">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="ja">日本語</option>
  </select>
  <button id="theme-toggle" class="tf-btn" type="button"><span id="theme-icon" aria-hidden="true"></span></button>
  <button id="exit-board" class="tf-btn" type="button"><span aria-hidden="true">⏻</span></button>
  <div id="live"><span class="dot"></span><span id="live-text">live</span></div>
</header>
<main>
  <div class="board-note" id="board-note" hidden></div>
  <div class="board" id="board"></div>
  <details class="strip" id="strip-done"></details>
  <details class="strip" id="strip-cancelled"></details>
</main>

    cost_title: 'What this task took',

// Default is always 'en' when nothing is stored - unlike the theme, language
// is never inferred from the browser/OS, only from an explicit user choice.
let lang = localStorage.getItem('lang') || 'en';
function t(key) {
  return (I18N[lang] && I18N[lang][key]) ?? I18N.en[key];
}

// ---------- status metadata ----------
// Colors are theme tokens (language-independent). Labels are looked up live
// via t() so they follow the current language instead of being frozen at
// object-creation time.
const STATUS_COLOR = {
  backlog: 'var(--st-backlog)', open: 'var(--st-open)', ready: 'var(--st-ready)',
  in_progress: 'var(--st-in_progress)', review: 'var(--st-review)',
  done: 'var(--st-done)', cancelled: 'var(--st-cancelled)',
};
const STATUS_LABEL_KEY = {
  backlog: 'status_backlog', open: 'status_open', ready: 'status_ready',
  in_progress: 'status_in_progress', review: 'status_review',
  done: 'status_done', cancelled: 'status_cancelled',
};
// Direct key-based lookup for the done/cancelled strip headings - deliberately
// not a string comparison against a translated label (that breaks on any
// language other than the one it was written for).
const STATUS_STRIP_LABEL_KEY = { done: 'status_done_plural', cancelled: 'status_cancelled_plural' };
function statusLabel(st) { return t(STATUS_LABEL_KEY[st]); }

const ACTIVE = ['backlog', 'open', 'ready', 'in_progress', 'review'];
const PRIO_ORDER = { Blocker: 0, Critical: 1, Major: 2, Medium: 3, Minor: 4 };
const PRIO_ICON = { Blocker: '⛔', Critical: '▲', Major: '◆', Medium: '●', Minor: '▽' };
// Only tasks not yet "in active work" can be dragged onto the Cancelled strip
// (see doc/brief/T-0017-01-drag-cancel.md) - literally backlog/open, nothing else.
const DRAG_CANCELLABLE = ['backlog', 'open'];
// Only a backlog card can be dragged into the Open column (T-0075): the single
// transition backlog -> open, mirroring what the server endpoint accepts.
const DRAG_OPENABLE = ['backlog'];
// ...and only a ready card into the In Progress column (T-0084): ready ->
// in_progress, again exactly what its endpoint accepts.
const DRAG_STARTABLE = ['ready'];
// ...and only an open card back into the Backlog column (T-0141): open ->
// backlog, the one step of the graph that can be walked in both directions.
const DRAG_RETURNABLE = ['open'];
// Status of the card currently being dragged, captured on dragstart and cleared
// on dragend. dragover cannot read the dataTransfer payload (browsers only
// expose it on drop), so this is how a drop zone knows, while the pointer is
// still moving, whether it may accept this particular drag at all.
let draggedStatus = null;
// Same idea for "this card has unfinished prerequisites": the In Progress zone
// has to refuse it while the pointer is still moving.
let draggedBlocked = false;
// Which session commands the server has configured (/api/board), and the run
// profiles the user declared. The drop confirmation reads it to say whether an
// agent will really be started; the task dialog, to offer the profiles — and it
// offers exactly the declared ones, never a list of its own (T-0108).
// `profileUsedBy` is which of the templates actually contains {profile}
// (T-0121). `orchestrator` is the review session (T-0122): unset, the card's
// review action is absent, since starting that session is all the action does.
let sessionsConfigured = {
  enabled: false, worker: false, orchestrator: false, profiles: [], profileUsedBy: {},
};
// Live session state, task id -> registry record (T-0077). Kept apart from
// `tasks` because it is apart at the source: a session starting or dying does
// not touch doc/backlog.md, so it arrives from its own uncached endpoint
// (/api/sessions) on its own SSE event, and never through the cached board.
let sessionsById = new Map();
// What each task took, summed over every session the registry still has
// (T-0116). It arrives with the records, from the same response, because it is
// made of them and goes stale on exactly the same events.
let costsById = new Map();
// What the watchdog found, task id -> { kind, branches } (T-0159), and what the
// checkout's own branch is called, for the one finding that names it. Only
// discrepancies are in here: a task the board and git agree about has no entry,
// and on a healthy project the whole map is empty. It arrives with the session
// records because it is made of them and of git — neither of which moves when
// doc/backlog.md does.
let watchdogById = new Map();
let watchdogHead = null;

let tasks = [];
// What the server said about the board itself, verbatim, or null when it said
// nothing (T-0247). It belongs to no task — it is the reason there are none —
// and until this existed the page threw it away and drew five empty columns.
let boardError = null;
let typeFilter = 'all'; // 'all' | 'feature' | 'bug' | 'external'
let searchQuery = ''; // free-text filter (T-0042), combined with typeFilter by AND
let priorityFilter = new Set(); // multi-select priority filter (T-0044); empty = inactive (all priorities shown)
let blockedOnly = false; // "blocked only" toggle (T-0092), combined with the rest by AND
// Multi-select label filter (T-0279); empty = inactive. OR within itself - a
// task carrying ANY of the selected labels - and AND with everything above.
let labelFilter = new Set();
const modals = []; // stack for Esc handling
// Set once the board process is gone for good (T-0082). It is what tells a
// deliberate stop from a lost connection, so nothing but the shutdown path sets it.
let boardStopped = false;
let stoppedScreen = null;
let sse = null; // the live EventSource, kept so the stopped screen can close it

function filteredTasks() {
  const byType = typeFilter === 'all' ? tasks : tasks.filter((task) => task.type === typeFilter);
  const q = searchQuery.toLowerCase();
  const byText = !searchQuery ? byType : byType.filter((task) =>
    String(task.title || '').toLowerCase().includes(q) ||
    String(task.description || '').toLowerCase().includes(q) ||
    String(task.id || '').toLowerCase().includes(q) ||
    // Labels are searched like the title (T-0279), which is the whole answer to
    // "sort by them": typing part of a label finds the tasks carrying it without
    // opening the popover, and is why the board has no sorting control.
    (task.labels || []).some((label) => String(label).toLowerCase().includes(q))
  );
  const byPriority = priorityFilter.size === 0
    ? byText
    : byText.filter((task) => priorityFilter.has(task.priority));
  const byBlocked = !blockedOnly
    ? byPriority
    // The server's `blockedBy` verbatim, not blockingIdsFor(): this filter answers
    // "which tasks have an unfinished prerequisite", and a finished task that was
    // closed while one of its prerequisites was still open is one of them, even
    // though its card carries no marker.
    : byPriority.filter((task) => (task.blockedBy || []).length > 0);
  if (labelFilter.size === 0) return byBlocked;
  return byBlocked.filter((task) => (task.labels || []).some((label) => labelFilter.has(label)));
}

// Every label any task carries, sorted, so the filter and the card's editor
// offer the same set. It spans the archive for free: the board merges both files
// before it ever gets here (boardTasks in server/server.js).
function labelsInUse() {
  const seen = new Set();
  for (const task of tasks) for (const label of task.labels || []) seen.add(label);
  return [...seen].sort();
}

// ---------- tiny markdown renderer (safe: escapes HTML first) ----------
function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function md(src) {
  const blocks = esc(src).split(/```/);
  let out = '';
  blocks.forEach((block, i) => {
    if (i % 2 === 1) { out += '<pre><code>' + block.replace(/^\w*\n/, '') + '</code></pre>'; return; }
    const lines = block.split('\n');
    let inList = false, html = '';
    for (let line of lines) {
      line = line
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      const h = line.match(/^(#{1,3}) (.+)/);
      const li = line.match(/^\s*- (?:\[([ x])\] )?(.*)/);
      if (li) {
        if (!inList) { html += '<ul>'; inList = true; }
        const box = li[1] === undefined ? '' : (li[1] === 'x' ? '☑ ' : '☐ ');
        html += '<li>' + box + li[2] + '</li>';
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }
      if (h) { html += `<h${h[1].length}>${h[2]}</h${h[1].length}>`; }
      else if (line.trim()) { html += '<p>' + line + '</p>'; }
    }
    if (inList) html += '</ul>';
    out += html;
  });
  return out;
}

// ---------- rendering ----------
function sortTasks(list, byClosed) {
  return [...list].sort((a, b) =>
    byClosed
      ? (b.closed || '').localeCompare(a.closed || '')
      : (PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority]) || a.created.localeCompare(b.created)
  );
}

// Unfinished prerequisites worth showing on a card. The list itself is computed
// by the server and arrives in `blockedBy` (/api/board) - the board never walks
// the dependency graph. A closed task is not waiting for anything, so its own
// stale prerequisites are not advertised.
function blockingIdsFor(task) {
  if (!ACTIVE.includes(task.status)) return [];
  return task.blockedBy || [];
}

// Substitutes {name} placeholders in a translated string. The replacement is a
// function, not a string: a task title containing "$&" or "$'" would otherwise
// be re-expanded by String.replace's dollar patterns.
function tFill(key, vars) {
  let out = t(key);
  for (const name of Object.keys(vars)) {
    out = out.replace('{' + name + '}', () => String(vars[name]));
  }
  return out;
}

// A blocker title has to share the card's top row with the id, the priority and
// the type chips, so it is cut to this many characters; the tooltip carries it
// whole. The budget is what a 220px column (the board's narrowest) still shows
// without eliding: ~33 monospace characters at 10px, minus the marker's own
// "waiting: " prefix.
const BLOCKED_TITLE_MAX = 24;

function truncate(text, max) {
  const s = String(text == null ? '' : text);
  return s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
}

// What the blocked marker says, or null when the task is not blocked. One
// prerequisite is named ("waiting: get the API keys from the client") - that is
// the whole point of the marker, since a bare id answers "blocked by something"
// rather than "waiting for what". Several would not fit, so they are counted and
// the tooltip lists them in full as "id — title"; the ids stay reachable there
// because an id is what a person types into the CLI next.
function blockedBadge(task) {
  const ids = blockingIdsFor(task);
  if (!ids.length) return null;
  const entries = ids.map((id) => {
    const dep = tasks.find((x) => x.id === id);
    return { id, title: dep ? String(dep.title || '') : t('dep_unknown') };
  });
  return {
    label: entries.length === 1
      ? tFill('blocked_one', { title: truncate(entries[0].title, BLOCKED_TITLE_MAX) })
      : tFill('blocked_many', { count: entries.length }),
    tooltip: entries.map((e) => `${e.id} — ${e.title}`).join('\n'),
  };
}

// Which session state a registry record is in, or null when the task has no
// session at all. A killed session reports no exit code but a signal, and
// "stopped on purpose" is not the same news as "crashed"; `interrupted` is a
// third kind of ending — the session went down with the board (T-0102).
const SESSION_CLASS = {
  running: 'running', ended: 'ended', stopped: 'ended',
  failed: 'failed', interrupted: 'interrupted',
};
function sessionState(id) {
  const record = sessionsById.get(id);
  if (!record) return null;
  if (record.status === 'running') return 'running';
  if (record.status === 'interrupted') return 'interrupted';
  if (record.signal) return 'stopped';
  return record.exitCode === 0 ? 'ended' : 'failed';
}

function sessionFlagHtml(task) {
  const state = sessionState(task.id);
  if (!state) return '';
  return `<span class="session-flag ${SESSION_CLASS[state]}" title="${esc(t('session_' + state + '_hint'))}">` +
    `<span class="dot" aria-hidden="true"></span>${esc(t('session_' + state))}</span>`;
}

// Why the board has nothing written down about this session's processes, or null
// when it has (T-0242).
//
// The reason is the condition, not `treeUnknown` on its own. Every session is
// marked from the moment it starts and stays marked until the first scan half a
// minute later, which is the ordinary way a session begins and nothing anyone
// can act on; a reason is set only where a read actually failed, which is the
// case this marker exists for. The server's own start-up message draws the line
// in the same place.
//
// The reason is the board's own diagnostic — `powershell: no answer within
// 30000ms` — and is passed through untranslated, like a session's exit code:
// inventing wordings for the failures of a command this board does not own is
// how the interface would start lying about them.
function sessionTreeReason(id) {
  const record = sessionsById.get(id);
  if (!record || !record.treeUnknown) return null;
  const reason = String(record.treeReason || '');
  return reason ? reason : null;
}

function treeFlagHtml(task) {
  const reason = sessionTreeReason(task.id);
  if (!reason) return '';
  return `<span class="tree-flag" title="${esc(tFill('tree_unknown_note', { reason }))}">` +
    `${esc(t('tree_unknown_label'))}</span>`;
}

// The same fact in the dialog, where there is room for what it costs. Built as a
// card-action block with no row: the board has nothing to offer pressing here —
// the failing read is its own, it retries on its own, and what the reader may
// want to do about it (stop the session) is the block right below this one.
function treeNoteHtml(task) {
  const reason = sessionTreeReason(task.id);
  if (!reason) return '';
  return `<div class="card-action"><h3>${esc(t('tree_unknown_title'))}</h3>` +
    `<div class="card-action-what">${esc(tFill('tree_unknown_note', { reason }))}</div></div>`;
}

// The watchdog's five findings (T-0159), each with a label short enough for a
// card and the whole observation for the tooltip and the dialog. The server
// sends the kind, never the text: the wording is interface, and it is translated
// like the rest of it.
const WATCH_KEY = {
  'work-not-recorded': 'watch_unrecorded',
  'session-left-nothing': 'watch_nothing',
  'review-without-branch': 'watch_no_branch',
  'review-without-commits': 'watch_no_commits',
  'done-not-merged': 'watch_unmerged',
};

// What the board says about this task, or null when it has nothing to say —
// which is the normal case and stays silent everywhere.
function watchdogFinding(id) {
  const found = watchdogById.get(id);
  if (!found || !WATCH_KEY[found.kind]) return null;
  const branches = found.branches || [];
  return {
    kind: found.kind,
    label: t(WATCH_KEY[found.kind] + '_label'),
    text: tFill(WATCH_KEY[found.kind] + '_note', {
      // Several branches match a task badly enough that the closing block
      // refuses to guess between them; here they are simply all named.
      branch: branches.length ? branches.join(', ') : 'task/' + id,
      head: watchdogHead || 'HEAD',
    }),
  };
}

// What of the finding a card's DOM depends on, for cardSig().
function watchdogSig(id) {
  const found = watchdogFinding(id);
  return found ? found.kind + ' ' + found.text : '';
}

function watchdogFlagHtml(task) {
  const found = watchdogFinding(task.id);
  if (!found) return '';
  return `<span class="watch-flag" title="${esc(found.text)}">${esc(found.label)}</span>`;
}

function watchdogNoteHtml(task) {
  const found = watchdogFinding(task.id);
  if (!found) return '';
  return `<div class="watch-note"><h3>${esc(t('watch_title'))}</h3><p>${esc(found.text)}</p></div>`;
}

// Type chips a card/dialog carries. `feature` is the ordinary case and stays
// unmarked, so a tag on a card always means "this is not ordinary work".
const TYPE_TAG_KEY = { bug: 'tag_bug', external: 'tag_external' };
function typeTagHtml(task) {
  const key = TYPE_TAG_KEY[task.type];
  return key ? `<span class="tag-${task.type}">${esc(t(key))}</span>` : '';
}

// A row of its own under the title, and only when there is something to draw
// (T-0279) - see the .card .labels rule for why not the `.top` row.
function cardLabelsHtml(task) {
  const labels = task.labels || [];
  if (!labels.length) return '';
  return (
    '<div class="labels">' +
    labels.map((label) => `<span class="label-chip">${esc(label)}</span>`).join('') +
    '</div>'
  );
}

function cardEl(task) {
  const div = document.createElement('div');
  div.className = 'card' + (task.status === 'done' || task.status === 'cancelled' ? ' closed-task' : '');
  div.style.borderLeftColor = STATUS_COLOR[task.status];
  div.tabIndex = 0;
  div.dataset.id = task.id; // stable key for focus restore across re-render (T-0048)
  const badge = blockedBadge(task);
  div.innerHTML = `
    <div class="top">
      <span class="id">${task.id}</span>
      <span class="prio ${task.priority}" title="${task.priority}" aria-label="${task.priority}">${PRIO_ICON[task.priority] || task.priority}</span>
      ${typeTagHtml(task)}
      ${badge ? `<span class="blocked-flag" title="${esc(badge.tooltip)}">${esc(badge.label)}</span>` : ''}
      ${task.awaitingAnswer ? `<span class="awaiting-flag" title="${esc(t('awaiting_hint'))}"><span aria-hidden="true">?</span> ${t('awaiting_label')}</span>` : ''}
      ${sessionFlagHtml(task)}
      ${treeFlagHtml(task)}
      ${watchdogFlagHtml(task)}
    </div>
    <div class="title">${esc(task.title)}</div>
    ${cardLabelsHtml(task)}
    <div class="foot">
      <span>${t('created_label')} ${task.created || '—'}</span>
      ${task.briefs.length ? `<span>${t('briefs_label')}: ${task.briefs.length}</span>` : ''}
      ${task.closed ? `<span>${t('closed_label')} ${task.closed}</span>` : ''}
    </div>`;
  const open = () => openTask(task.id);
  div.addEventListener('click', open);
  div.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
  // A card is draggable when at least one drop zone would accept it: the
  // Cancelled strip, the Open column, the In Progress column. Which of them
  // lights up is decided per-zone in dragstart below.
  //
  // A ready card whose prerequisites are unfinished is accepted by none of them
  // (the server refuses to start it, and `ready` cannot be cancelled from the
  // board either), so it stays undraggable rather than offering a drag that
  // could only end in an error.
  const blocked = blockingIdsFor(task).length > 0;
  const cancellable = DRAG_CANCELLABLE.includes(task.status);
  const openable = DRAG_OPENABLE.includes(task.status);
  const startable = DRAG_STARTABLE.includes(task.status) && !blocked;
  const returnable = DRAG_RETURNABLE.includes(task.status);
  if (cancellable || openable || startable || returnable) {
    div.draggable = true;
    div.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
      draggedStatus = task.status;
      draggedBlocked = blocked;
      // Each zone lights up only for the statuses it actually accepts, so the
      // board never advertises a drop that would be refused on release.
      if (cancellable) cancelStrip.classList.add('drag-available');
      if (openable && openColumn) openColumn.classList.add('drag-available');
      if (startable && inProgressColumn) inProgressColumn.classList.add('drag-available');
      if (returnable && backlogColumn) backlogColumn.classList.add('drag-available');
    });
    // dragend always fires (drop, Esc cancel, or release outside any target),
    // so it's the reliable place to clear every highlight state - this is a
    // safety net in case dragleave didn't fire for some reason (e.g. the
    // drag was cancelled while the window lost focus).
    div.addEventListener('dragend', () => {
      draggedStatus = null;
      draggedBlocked = false;
      cancelStrip.classList.remove('drag-available');
      cancelStrip.classList.remove('drop-target');
      for (const col of [openColumn, inProgressColumn, backlogColumn]) {
        if (!col) continue;
        col.classList.remove('drag-available');
        col.classList.remove('drop-target');
      }
    });
  }
  // Signature of the task fields this node was built from, so the incremental
  // renderer (T-0068) can tell whether an existing node can be reused as-is.
  div._sig = cardSig(task);
  return div;
}

// Persistent board structure (T-0068). The columns, their `.cards` scroll
// containers and the strip summaries are built once and then reused across every
// SSE `changed`. Earlier render() tore the whole board down with innerHTML='' on
// each event, which recreated every card node (expensive on large backlogs) and
// snapped each column's independent scroll (T-0043) back to the top - T-0048
// then captured/restored scroll and focus around that teardown. Keeping the
// containers alive makes both problems disappear: card nodes are diffed in place
// (see reconcileCards) and column scroll survives naturally because the
// scrollable element itself is never replaced.
let scrollContainers = {}; // status key -> live `.cards` container
let columnHeads = {};      // status key -> active-column `.col-head` element
let stripSummaries = {};   // status key -> done/cancelled strip <summary> element
let openColumn = null;     // the Open column's `.col` element (drop zone, T-0075)
let inProgressColumn = null; // the In Progress column's `.col` element (drop zone, T-0084)
let backlogColumn = null;  // the Backlog column's `.col` element (drop zone, T-0141)
let boardBuilt = false;

// Builds the static board skeleton once. Each per-status `.cards` container
// carries a stable data-status key and is cached, so later renders update its
// contents in place without ever recreating the scrollable element.
function buildBoardStructure() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  scrollContainers = {};
  columnHeads = {};
  stripSummaries = {};
  for (const st of ACTIVE) {
    const col = document.createElement('div');
    col.className = 'col';
    const head = document.createElement('div');
    head.className = 'col-head';
    head.style.color = STATUS_COLOR[st];
    const cards = document.createElement('div');
    cards.className = 'cards';
    cards.dataset.status = st; // stable key for scroll + diff across re-render
    col.appendChild(head);
    col.appendChild(cards);
    board.appendChild(col);
    columnHeads[st] = head;
    scrollContainers[st] = cards;
    // Three columns double as drop zones: Open (for backlog cards), In Progress
    // (for ready ones) and Backlog (for open ones on their way back). Their
    // elements outlive every later render (that is the whole point of this
    // skeleton), so the listeners are attached here, exactly once, and never in
    // render().
    if (st === 'open') {
      openColumn = col;
      attachOpenDropZone(col);
    }
    if (st === 'in_progress') {
      inProgressColumn = col;
      col.classList.add('drop-start'); // paints its highlight in the In Progress color
      attachStartDropZone(col);
    }
    if (st === 'backlog') {
      backlogColumn = col;
      col.classList.add('drop-back'); // paints its highlight in the Backlog color
      attachReturnDropZone(col);
    }
  }
  for (const st of ['done', 'cancelled']) {
    const strip = document.getElementById('strip-' + st);
    strip.innerHTML = '';
    const summary = document.createElement('summary');
    summary.style.color = STATUS_COLOR[st];
    const cards = document.createElement('div');
    cards.className = 'cards';
    cards.dataset.status = st;
    strip.appendChild(summary);
    strip.appendChild(cards);
    stripSummaries[st] = summary;
    scrollContainers[st] = cards;
  }
  boardBuilt = true;
}

// A compact signature of every task field the card DOM depends on (including the
// active language, since a few card labels are translated). Two renders with an
// equal signature can safely reuse the same card node; any difference forces a
// fresh node so the card's content stays correct.
function cardSig(task) {
  const badge = blockedBadge(task);
  return [
    task.id, task.priority, task.type, task.status,
    task.created, task.closed, (task.briefs || []).length, task.title, lang,
    // The labels themselves, not their count: a card re-labelled while the board
    // is open moves nothing else about the task, so without this the chips would
    // wait for a page reload (the T-0083/T-0087 lesson).
    (task.labels || []).join('\u0002'),
    // The rendered marker text, not just the blocker ids: without it the marker
    // would outlive its own prerequisite being closed (T-0087), and renaming a
    // blocker would leave the old title on the card until something else about
    // the task changed - both would need a page reload to catch up (T-0092).
    badge ? badge.label + '\u0002' + badge.tooltip : '',
    // A session appends its questions long after the card was first drawn, and
    // nothing else about the task changes when it does - left out of the
    // signature, the marker would only appear after a page reload (T-0083).
    task.awaitingAnswer ? '?' : '',
    // Session state lives outside `task` entirely and changes while the card is
    // on screen — a session dying is exactly the moment the card must be
    // repainted, and nothing in the task itself moves when it does (T-0077).
    sessionState(task.id) || '',
    // And once more for the mark that says the board has not written this
    // session's processes down (T-0242): it appears and goes away between scans,
    // half a minute apart, while nothing in the task moves at all.
    sessionTreeReason(task.id) || '',
    // Same reasoning again for the watchdog's mark (T-0159): it is decided
    // outside `task` entirely, and the moment it appears or goes away — a
    // session ending, a branch merged in a terminal — moves nothing in the task
    // itself. The rendered text and not just the kind, so a finding that starts
    // naming a second branch repaints the card too.
    watchdogSig(task.id),
  ].join('\u0001');
}

function sameChildren(children, desired) {
  if (children.length !== desired.length) return false;
  for (let i = 0; i < desired.length; i++) {
    if (children[i] !== desired[i]) return false;
  }
  return true;
}

// Reconciles the card nodes inside `container` to match `list` (already sorted).
// Returns the node whose task id equals `focusId` when it lives in this
// container (else null), so render() can restore keyboard focus to it.
function reconcileCards(container, list, focusId) {
  const existing = new Map();
  for (const child of container.children) {
    if (child.dataset && child.dataset.id) existing.set(child.dataset.id, child);
  }
  let focusNode = null;
  const desired = list.map((task) => {
    const prev = existing.get(task.id);
    const node = prev && prev._sig === cardSig(task) ? prev : cardEl(task);
    if (task.id === focusId) focusNode = node;
    return node;
  });
  // Fast path: an unaffected column keeps its exact node set/order untouched.
  if (desired.length && sameChildren(container.children, desired)) return focusNode;
  // Detach all current children first (removeChild works on both the real DOM
  // and the tests' fake DOM), then re-append the desired nodes in order. Reused
  // nodes keep their identity across this move; only genuinely changed cards were
  // rebuilt above, so unchanged cards are never recreated.
  while (container.children.length) container.removeChild(container.children[0]);
  if (!desired.length) {
    container.innerHTML = `<div class="empty" style="font-size:12px">${t('empty_list')}</div>`;
  } else {
    container.innerHTML = ''; // clear any leftover empty placeholder from before
    for (const node of desired) container.appendChild(node);
  }
  return focusNode;
}

// If a card (or something inside it) currently holds focus, return its task id
// so the reconciled board can restore keyboard focus to the same card. (T-0048)
function focusedCardId() {
  const active = document.activeElement;
  const card = active && active.closest ? active.closest('.card') : null;
  return card ? card.dataset.id : null;
}

// The command that ends the state the note describes. It is the same line in a
// clone and in a project scaffolded by `briefboard init`, because both get
// tools/task.mjs — so there is one command to name and no guessing about which
// install the reader is looking at.
const FIRST_TASK_CMD = 'node tools/task.mjs add --type feature --priority Major --title "..."';

// What the board says about itself, above the columns (T-0247). /api/board has
// answered `{"tasks":[],"error":"doc/backlog.md not found"}` since the endpoint
// existed; five empty columns were all the page ever did with it, and they read
// as "no tasks yet" — which is the one thing it does not mean. On the documented
// clone path that empty board is the first screen there is.
//
// An error with no wording of its own is still shown, in the server's words:
// silence is the bug being fixed here, and a future error the interface has
// never heard of is exactly the case where silence costs most.
function renderBoardNote() {
  const note = document.getElementById('board-note');
  if (!boardError) {
    note.innerHTML = '';
    note.hidden = true;
    return;
  }
  note.innerHTML = boardError === 'doc/backlog.md not found'
    ? `<h2>${esc(t('board_missing_title'))}</h2>` +
      `<p>${esc(t('board_missing_what'))}</p>` +
      `<p>${esc(t('board_missing_how'))} <code>${esc(FIRST_TASK_CMD)}</code></p>`
    : `<h2>${esc(t('board_error_title'))}</h2><p>${esc(boardError)}</p>`;
  note.hidden = false;
}

function render() {
  // Preserve card focus across the in-place reconcile (T-0048). Column scroll is
  // preserved for free now that the containers are never torn down (T-0068).
  const focusId = focusedCardId();
  // Repainted from here rather than from load(), so switching the language
  // retranslates it along with everything else.
  renderBoardNote();
  let cardToFocus = null;

  const list = filteredTasks();
  if (!boardBuilt) buildBoardStructure();

  for (const st of ACTIVE) {
    const inCol = sortTasks(list.filter((task) => task.status === st));
    // The head text (count + translated label) is cheap to refresh every render.
    columnHeads[st].innerHTML = `<span class="hash">##</span> ${statusLabel(st)}
        <span class="count">${inCol.length}</span>`;
    const f = reconcileCards(scrollContainers[st], inCol, focusId);
    if (f) cardToFocus = f;
  }
  for (const st of ['done', 'cancelled']) {
    const inStrip = sortTasks(list.filter((task) => task.status === st), true);
    stripSummaries[st].innerHTML = `<span class="chev">›</span><span class="hash" style="color:var(--muted)">##</span>
        ${t(STATUS_STRIP_LABEL_KEY[st])}
        <span class="count" style="color:var(--muted);font-weight:400">${inStrip.length}</span>`;
    const f = reconcileCards(scrollContainers[st], inStrip, focusId);
    if (f) cardToFocus = f;
  }

  // Return focus to the same card if it still exists; preventScroll keeps the
  // preserved column scroll from being nudged by the focus call.
  if (cardToFocus) cardToFocus.focus({ preventScroll: true });
  // The label set grows and shrinks with the tasks themselves, so both the
  // header filter and an open card's editor are repainted from the same render.
  renderLabelFilter();
  refreshOpenTaskLabels();
}

// ---------- modals ----------
const FOCUSABLE_SEL =
  'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), ' +
  'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
let modalTitleSeq = 0; // makes aria-labelledby ids unique per opened dialog

// Background page chrome that must be inert while any dialog is open, so the
// board underneath is neither reachable by Tab nor announced by screen readers.
function backgroundRegions() {
  return [document.querySelector('header'), document.querySelector('main')].filter(Boolean);
}

function setInert(el, on) {
  if (!el) return;
  if (on) {
    el.setAttribute('inert', '');
    el.setAttribute('aria-hidden', 'true');
    el.inert = true;
  } else {
    el.removeAttribute('inert');
    el.removeAttribute('aria-hidden');
    el.inert = false;
  }
}

function focusablesIn(panel) {
  return Array.prototype.slice
    .call(panel.querySelectorAll(FOCUSABLE_SEL))
    .filter((el) => !el.hasAttribute('disabled'));
}

// Recompute inertness across the whole stack: the page chrome is inert whenever
// a modal is open, and every overlay except the top one is inert too (so a brief
// opened over a task leaves the task dimmed and unreachable).
function refreshModalChrome() {
  const anyOpen = modals.length > 0;
  const top = modals[modals.length - 1];
  for (const el of backgroundRegions()) setInert(el, anyOpen);
  modals.forEach((overlay) => setInert(overlay, overlay !== top));
}

// Move focus into a dialog: first focusable element, else the panel itself
// (which carries tabindex="-1" so it can hold focus without being tabbable).
function focusIntoModal(overlay) {
  const panel = overlay.querySelector('.panel');
  const f = focusablesIn(panel);
  (f.length ? f[0] : panel).focus();
}

// Give the dialog an accessible name from its <h2>, if it has one. Best-effort:
// the brief modal has no <h2>, and openBrief replaces .panel.innerHTML async, so
// the label may not apply there - the role/aria-modal attributes still do.
function labelModal(panel) {
  const h2 = panel.querySelector('h2');
  if (!h2) return;
  if (!h2.id) h2.id = 'modal-title-' + ++modalTitleSeq;
  panel.setAttribute('aria-labelledby', h2.id);
}

function openModal(innerHTML) {
  const trigger = document.activeElement; // element to restore focus to on close
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="panel">${innerHTML}</div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeTop(); });
  document.body.appendChild(overlay);

  // Set a11y attributes with setAttribute (not in the innerHTML string) so they
  // survive openBrief replacing .panel.innerHTML after the fetch resolves.
  const panel = overlay.querySelector('.panel');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('tabindex', '-1');
  labelModal(panel);

  overlay._trigger = trigger;
  modals.push(overlay);
  refreshModalChrome();
  focusIntoModal(overlay);
  return overlay;
}

function closeTop() {
  const m = modals.pop();
  if (!m) return;
  m.remove();
  refreshModalChrome();
  const trigger = m._trigger;
  if (trigger && typeof trigger.focus === 'function' && document.contains(trigger)) {
    trigger.focus(); // return focus to the card/element that opened the dialog
  } else if (modals.length) {
    focusIntoModal(modals[modals.length - 1]); // fell back to the underlying modal
  }
}

function trapTab(e) {
  const overlay = modals[modals.length - 1];
  if (!overlay) return;
  const panel = overlay.querySelector('.panel');
  const f = focusablesIn(panel);
  const active = document.activeElement;
  if (!f.length) {
    e.preventDefault();
    if (active !== panel) panel.focus();
    return;
  }
  const first = f[0];
  const last = f[f.length - 1];
  const inside = active === panel || f.indexOf(active) !== -1;
  if (e.shiftKey) {
    if (!inside || active === first) { e.preventDefault(); last.focus(); }
  } else {
    if (!inside || active === last) { e.preventDefault(); first.focus(); }
  }
}

document.addEventListener('keydown', (e) => {
  if (!modals.length) return;
  if (e.key === 'Escape') closeTop();
  else if (e.key === 'Tab') trapTab(e);
});

// One dependency chip: the prerequisite's id plus its current status, so the
// answer to "is it done yet?" is on screen. A `cancelled` prerequisite gets its
// own class (struck-through id) - it no longer blocks, but a task standing on a
// cancelled premise must not read as quietly satisfied (T-0087).
function depLinkHtml(depId) {
  const dep = tasks.find((x) => x.id === depId);
  const status = dep ? dep.status : null;
  const label = dep ? statusLabel(status) : t('dep_unknown');
  const color = status ? STATUS_COLOR[status] : 'var(--muted)';
  const hint = status === 'cancelled' ? ` title="${esc(t('dep_cancelled_hint'))}"` : '';
  return `<span class="brief-link dep-link${status === 'cancelled' ? ' dep-cancelled' : ''}" data-task="${esc(depId)}"${hint}>` +
    `<span class="dep-id">${esc(depId)}</span>` +
    `<span class="dep-status" style="color:${color}">${esc(label)}</span></span>`;
}

// Same mechanics as the brief links next to them: a click opens that task's own
// dialog on top of this one.
function wireDependencyLinks(overlay) {
  overlay.querySelectorAll('[data-task]').forEach((el) =>
    el.addEventListener('click', () => openTask(el.dataset.task))
  );
}

// The run profile of the task's sessions (T-0108), offered only where the user
// declared profiles at all — with none declared the field means nothing here,
// so the row is absent rather than empty. The values come from the server's
// declaration and are written back as they were read: the board has no idea what
// any of them stands for.
// Declaring the profiles is only half of the feature; the other half is
// {profile} in the command template, and without it the chosen value has
// nowhere to go. The selector still appears — it writes a real field, and a
// control that vanishes has already been read once as a lost feature — but it
// says what it will and will not reach (T-0121). The kinds are weighed
// separately: only the ones that could actually run count, and a placeholder in
// the worker template says nothing about the briefing one.
//
// The partial case names the kinds that do use it rather than having a string
// per combination: with three kinds (T-0122) that would be six, and one more
// with every kind added.
function profileNoteText() {
  const used = sessionsConfigured.profileUsedBy || {};
  const kinds = [];
  if (sessionsConfigured.enabled) kinds.push('briefing');
  if (sessionsConfigured.worker) kinds.push('worker');
  if (sessionsConfigured.orchestrator) kinds.push('orchestrator');
  const using = kinds.filter((kind) => !!used[kind]);
  if (!using.length) return t('profile_unused');
  if (using.length === kinds.length) return '';
  return tFill('profile_some_only', { kinds: using.map((kind) => t('cost_kind_' + kind)).join(', ') });
}

function profileSelectHtml(task) {
  const profiles = sessionsConfigured.profiles || [];
  const current = task.profile || '';
  const options = [`<option value=""${current ? '' : ' selected'}>${esc(t('profile_default'))}</option>`];
  for (const value of profiles) {
    options.push(`<option value="${esc(value)}"${value === current ? ' selected' : ''}>${esc(value)}</option>`);
  }
  // A value the declaration no longer carries is still what the file says, and
  // is still what stops that task's session from starting; showing it as
  // "default" would hide the very thing the reader has to fix.
  if (current && !profiles.includes(current)) {
    options.push(
      `<option value="${esc(current)}" selected title="${esc(t('profile_unknown'))}">${esc(current)}</option>`
    );
  }
  const noteText = profileNoteText();
  const note = noteText ? `<div class="profile-note">${esc(noteText)}</div>` : '';
  return `<select class="profile-select" data-profile-select="${esc(task.id)}">${options.join('')}</select>${note}`;
}

// ---------- what the task took (T-0116) ----------
// The board measures this itself, for any agent: how many sessions a task
// needed, of which kinds, how long they ran and how they ended. The token line
// appears only when the user declared an extractor AND it found something —
// with nothing declared the block says nothing about tokens, because a hint at
